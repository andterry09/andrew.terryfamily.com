<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Open World</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b1020;
    font-family: 'Segoe UI', sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #hud {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 10;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 0.9rem;
    line-height: 1.5;
    pointer-events: none;
  }
  #hud .title { font-weight: bold; color: #ffd700; font-size: 1rem; }
  #new-world {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 11;
    margin-top: 76px;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.9rem;
    font-family: inherit;
    cursor: pointer;
  }
  #new-world:hover { background: rgba(0, 0, 0, 0.75); }
  #hidden-badge {
    display: none;
    position: fixed;
    top: 150px;
    left: 12px;
    z-index: 10;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 0.9rem;
    pointer-events: none;
  }
  #help {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 0.85rem;
    white-space: nowrap;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="title">🌍 Open World</div>
  <div id="coords">x: 0, y: 0</div>
  <div id="berries">🫐 Berries: 0</div>
  <div id="shrooms">🍄 Mushrooms: 0</div>
</div>
<button id="new-world" type="button">🎲 New World</button>
<div id="hidden-badge">🤫 Hidden!</div>
<div id="help">WASD / Arrows to walk &nbsp;•&nbsp; Shift to run &nbsp;•&nbsp; Touch: drag to walk</div>
<script>
'use strict';
// ---------- Config ----------
var TILE = 32;
var ZOOM = 1.6; // zoomed-in camera (map layout unchanged)
var W = 240, H = 240;               // decently big, but NOT infinite
var WORLD_PX = W * TILE, WORLD_PY = H * TILE;
var WATER_LEVEL = 0.30;
var SAND_LINE = 0.345;

// Biome ids
var OCEAN = 0, WATER = 1, SAND = 2, GRASS = 3;

// ---------- Deterministic hashing / RNG ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(x, y, s) {
  var h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967295;
}

// ---------- Value noise ----------
var lat = new Float32Array(256);
var perm = new Uint8Array(512);
function seedNoise(rand) {
  var p = [];
  for (var i = 0; i < 256; i++) { p[i] = i; lat[i] = rand(); }
  for (var j = 255; j > 0; j--) {
    var k = (rand() * (j + 1)) | 0;
    var tmp = p[j]; p[j] = p[k]; p[k] = tmp;
  }
  for (var m = 0; m < 512; m++) perm[m] = p[m & 255];
}
function vnoise(x, y) {
  var xi = Math.floor(x), yi = Math.floor(y);
  var xf = x - xi, yf = y - yi;
  var X = xi & 255, Y = yi & 255;
  var v00 = lat[perm[(perm[X] + Y) & 511] & 255];
  var v10 = lat[perm[(perm[(X + 1) & 255] + Y) & 511] & 255];
  var v01 = lat[perm[(perm[X] + Y + 1) & 511] & 255];
  var v11 = lat[perm[(perm[(X + 1) & 255] + Y + 1) & 511] & 255];
  var u = xf * xf * (3 - 2 * xf);
  var v = yf * yf * (3 - 2 * yf);
  return (v00 * (1 - u) + v10 * u) * (1 - v) + (v01 * (1 - u) + v11 * u) * v;
}
function fbm(x, y, oct) {
  var sum = 0, amp = 0.5, f = 1, norm = 0;
  for (var i = 0; i < oct; i++) {
    sum += amp * vnoise(x * f, y * f);
    norm += amp;
    amp *= 0.5;
    f *= 2.03;
  }
  return sum / norm;
}

// ---------- World data ----------
var elev = new Float32Array(W * H);
var biome = new Uint8Array(W * H);   // OCEAN/WATER/SAND/GRASS
var trees = new Uint8Array(W * H);
var bushes = new Uint8Array(W * H);
var solid = new Uint8Array(W * H);
var berryN = new Uint8Array(W * H);   // berries currently on a bush (0-3)
var berryT = new Float32Array(W * H); // regrow timer per bush
var litter = new Uint8Array(W * H); // forest floor: 0 none, 1 leaf, 2 leaf, 3 stick
var stumps = new Uint8Array(W * H); // rare old stumps
var logs = new Uint8Array(W * H); // fallen leafless logs
var mushN = new Uint8Array(W * H); // mushrooms on a log (0-3)
var mushT = new Float32Array(W * H); // mushroom regrow timer
var mushScore = 0;
var seed = 20260906;
var score = 0, eatCd = 0;
var playerA = 1, wasHiding = false;
var treeA = new Float32Array(W * H).fill(1); // canopy fade per tree
var trunkA = new Float32Array(W * H); // trunk shows only when under the tree

function idx(x, y) { return y * W + x; }
function inBounds(x, y) { return x >= 0 && y >= 0 && x < W && y < H; }

function generate(s) {
  seed = s;
  var rand = mulberry32(seed);
  seedNoise(rand);
  var x, y;

  // Elevation with island falloff (ocean at the edges)
  for (y = 0; y < H; y++) {
    for (x = 0; x < W; x++) {
      var base = fbm(x * 0.014, y * 0.014, 4);
      base += 0.15 * fbm(x * 0.06 + 40, y * 0.06 + 40, 2);
      var dx = (x - W / 2) / (W / 2);
      var dy = (y - H / 2) / (H / 2);
      var d = Math.sqrt(dx * dx + dy * dy) / Math.SQRT2;
      elev[idx(x, y)] = base + 0.06 - Math.pow(d, 2.1) * 0.72;
    }
  }

  // Base water vs land
  for (var i = 0; i < W * H; i++) {
    biome[i] = elev[i] < WATER_LEVEL ? WATER : GRASS;
  }

  // Rivers: 3 winding downhill carves
  for (var r = 0; r < 3; r++) {
    // start at a high point
    var sx = 0, sy = 0, best = -1;
    for (var t = 0; t < 60; t++) {
      var px = 30 + ((rand() * (W - 60)) | 0);
      var py = 30 + ((rand() * (H - 60)) | 0);
      if (elev[idx(px, py)] > best) { best = elev[idx(px, py)]; sx = px; sy = py; }
    }
    var cx = sx, cy = sy, pdx = 0, pdy = 1;
    for (var step = 0; step < 700; step++) {
      if (!inBounds(cx, cy)) break;
      if (biome[idx(cx, cy)] === WATER && step > 10) break;
      // carve river (1-2 wide) + wet the elevation so banks read naturally
      for (var oy = -1; oy <= 1; oy++) {
        for (var ox = -1; ox <= 1; ox++) {
          var nx = cx + ox, ny = cy + oy;
          if (!inBounds(nx, ny)) continue;
          if (Math.abs(ox) + Math.abs(oy) <= 1) {
            biome[idx(nx, ny)] = WATER;
            elev[idx(nx, ny)] = Math.min(elev[idx(nx, ny)], WATER_LEVEL - 0.05);
          }
        }
      }
      // pick next step: prefer downhill + keep momentum + meander
      var bx = 0, by = 0, bs = -1e9;
      for (var ddy = -1; ddy <= 1; ddy++) {
        for (var ddx = -1; ddx <= 1; ddx++) {
          if (!ddx && !ddy) continue;
          if (ddx === -pdx && ddy === -pdy) continue;
          var qx = cx + ddx, qy = cy + ddy;
          if (!inBounds(qx, qy)) continue;
          var score = (elev[idx(cx, cy)] - elev[idx(qx, qy)]) * 4 +
                      (ddx * pdx + ddy * pdy) * 0.7 +
                      (hash2(qx, qy, seed + step) - 0.5) * 1.2;
          if (score > bs) { bs = score; bx = ddx; by = ddy; }
        }
      }
      pdx = bx; pdy = by; cx += bx; cy += by;
    }
  }

  // Ocean = water connected to the map border (flood fill); inland water stays lakes/rivers
  var stack = [];
  for (x = 0; x < W; x++) { stack.push([x, 0]); stack.push([x, H - 1]); }
  for (y = 0; y < H; y++) { stack.push([0, y]); stack.push([W - 1, y]); }
  while (stack.length) {
    var c = stack.pop();
    var qx2 = c[0], qy2 = c[1];
    if (!inBounds(qx2, qy2)) continue;
    var ii = idx(qx2, qy2);
    if (biome[ii] !== WATER || solid[ii] === 2) continue;
    biome[ii] = OCEAN;
    solid[ii] = 2; // visited marker reused below
    stack.push([qx2 + 1, qy2]); stack.push([qx2 - 1, qy2]);
    stack.push([qx2, qy2 + 1]); stack.push([qx2, qy2 - 1]);
  }

  // Spawn: nearest grass to center
  var spawn = { x: W >> 1, y: H >> 1 };
  outer:
  for (var rad = 0; rad < W; rad++) {
    for (var ay = -rad; ay <= rad; ay++) {
      for (var ax = -rad; ax <= rad; ax++) {
        if (Math.max(Math.abs(ax), Math.abs(ay)) !== rad) continue;
        var gx = (W >> 1) + ax, gy = (H >> 1) + ay;
        if (inBounds(gx, gy) && biome[idx(gx, gy)] === GRASS) {
          spawn = { x: gx, y: gy };
          break outer;
        }
      }
    }
  }

  // Sand: low land or land touching water
  for (y = 0; y < H; y++) {
    for (x = 0; x < W; x++) {
      var i2 = idx(x, y);
      if (biome[i2] !== GRASS) continue;
      if (elev[i2] < SAND_LINE) { biome[i2] = SAND; continue; }
      var nearWater = false;
      for (var wy = -1; wy <= 1 && !nearWater; wy++) {
        for (var wx = -1; wx <= 1; wx++) {
          if (!wx && !wy) continue;
          var vx = x + wx, vy = y + wy;
          if (!inBounds(vx, vy)) continue;
          var b = biome[idx(vx, vy)];
          if (b === WATER || b === OCEAN) { nearWater = true; break; }
        }
      }
      if (nearWater) biome[i2] = SAND;
    }
  }

  // Water is solid; everything else reset
  trees.fill(0); bushes.fill(0); solid.fill(0); berryN.fill(0); berryT.fill(0); litter.fill(0); stumps.fill(0); logs.fill(0); mushN.fill(0); mushT.fill(0);
  for (y = 0; y < H; y++) {
    for (x = 0; x < W; x++) {
      var i0 = idx(x, y);
      if (biome[i0] === WATER || biome[i0] === OCEAN) solid[i0] = 1;
    }
  }

  // Trees: random scatter inside forest areas (natural, not grid-like).
  // Candidates are shuffled and each tree keeps room for its own canopy,
  // so canopies never sit inside each other (small trees may cozy up,
  // big trees stand apart).
  var placedX = [], placedY = [], placedS = [], taken = [];
  var BC = 64;
  var BW = Math.ceil(WORLD_PX / BC), BH = Math.ceil(WORLD_PY / BC);
  var buckets = new Array(BW * BH);
  // returns -1 = reject, -2 = clean accept, or partner index = snuggle accept
  function treeOK(px, py, sc, cozy) {
    var xa = Math.max(0, Math.floor((px - 120) / BC)), xb = Math.min(BW - 1, Math.floor((px + 120) / BC));
    var ya = Math.max(0, Math.floor((py - 120) / BC)), yb = Math.min(BH - 1, Math.floor((py + 120) / BC));
    var touches = 0, minD = Infinity, partner = -1;
    for (var cy = ya; cy <= yb; cy++) {
      for (var cx = xa; cx <= xb; cx++) {
        var arr = buckets[cy * BW + cx];
        if (!arr) continue;
        for (var k = 0; k < arr.length; k++) {
          var j = arr[k];
          var dx = px - placedX[j], dy = py - placedY[j];
          var d = Math.sqrt(dx * dx + dy * dy);
          if (d < minD) minD = d;
          var need = 27.5 * (sc + placedS[j]) + 4;
          if (d < need) { touches++; partner = j; }
          if (touches > 1) return -1;
        }
      }
    }
    if (touches === 0) return -2;
    // snuggle exactly one neighbor that isn't already snuggling; trunks stay apart
    if (!cozy || taken[partner] || minD < 34) return -1;
    return partner;
  }
  var cands = [];
  for (y = 0; y < H; y++) {
    for (x = 0; x < W; x++) {
      var i3 = idx(x, y);
      if (biome[i3] !== GRASS) continue;
      var sdx = x - spawn.x, sdy = y - spawn.y;
      if (sdx * sdx + sdy * sdy < 36) continue;
      if (fbm(x * 0.03 + 300, y * 0.03 + 300, 3) > 0.54) cands.push(i3);
    }
  }
  for (var si = cands.length - 1; si > 0; si--) {
    var sj = (rand() * (si + 1)) | 0;
    var tmp = cands[si]; cands[si] = cands[sj]; cands[sj] = tmp;
  }
  var placed = 0;
  for (var ci = 0; ci < cands.length && placed < 1000; ci++) {
    var cix = cands[ci];
    var cxx = cix % W, cyy = (cix / W) | 0;
    var csc = treeScale(cxx, cyy);
    var cxp = (cxx + 0.5) * TILE, cyp = (cyy + 0.5) * TILE;
    var cozy = rand() < 0.06; // plenty of trees may snuggle one neighbor
    var verdict = treeOK(cxp, cyp, csc, cozy);
    if (verdict === -1) continue;
    var id = placedX.length;
    placedX.push(cxp); placedY.push(cyp); placedS.push(csc); taken.push(0);
    if (verdict >= 0) { taken[verdict] = 1; taken[id] = 1; }
    var bix = Math.min(BH - 1, Math.floor(cyp / BC)) * BW + Math.min(BW - 1, Math.floor(cxp / BC));
    if (!buckets[bix]) buckets[bix] = [];
    buckets[bix].push(id);
    trees[cix] = 1;
    solid[cix] = 1;
    placed++;
  }

  // Forest floor: fallen leaves + sticks scattered near trees
  for (var ly = 0; ly < H; ly++) {
    for (var lx = 0; lx < W; lx++) {
      if (!trees[idx(lx, ly)]) continue;
      for (var oy = -2; oy <= 2; oy++) {
        for (var ox = -2; ox <= 2; ox++) {
          var gx = lx + ox, gy = ly + oy;
          if (!inBounds(gx, gy)) continue;
          var gi = idx(gx, gy);
          if (biome[gi] !== GRASS) continue;
          if (hash2(gx, gy, seed + 101) < 0.38) {
            litter[gi] = 1 + ((hash2(gx, gy, seed + 102) * 3) | 0); // 1..3
          }
        }
      }
    }
  }

  // Bushes: random scatter on open grass
  for (y = 0; y < H; y++) {
    for (x = 0; x < W; x++) {
      var i4 = idx(x, y);
      if (biome[i4] !== GRASS || trees[i4]) continue;
      var bdx = x - spawn.x, bdy = y - spawn.y;
      if (bdx * bdx + bdy * bdy < 25) continue;
      if (hash2(x, y, seed + 9) < 0.07) {
        bushes[i4] = 1;
        berryN[i4] = 3;
        berryT[i4] = 0;
      }
    }
  }

  // A couple of old stumps on the forest floor (rare)
  var stumpsWanted = 25, stumpTries = 0;
  while (stumpsWanted > 0 && stumpTries < 1500) {
    stumpTries++;
    var qx = (rand() * W) | 0, qy = (rand() * H) | 0;
    var qi = idx(qx, qy);
    if (biome[qi] !== GRASS || trees[qi] || bushes[qi] || stumps[qi]) continue;
    var qdx = qx - spawn.x, qdy = qy - spawn.y;
    if (qdx * qdx + qdy * qdy < 64) continue;
    if (fbm(qx * 0.03 + 300, qy * 0.03 + 300, 3) <= 0.54) continue;
    var clear = true, nearTree = false;
    for (var sy2 = qy - 5; sy2 <= qy + 5 && clear; sy2++) {
      for (var sx2 = qx - 5; sx2 <= qx + 5 && clear; sx2++) {
        if (!inBounds(sx2, sy2)) continue;
        var sk = idx(sx2, sy2);
        if (!trees[sk] && !stumps[sk] && !logs[sk]) continue;
        var ddx = (qx - sx2) * TILE, ddy = (qy - sy2) * TILE;
        var d2 = ddx * ddx + ddy * ddy;
        if (trees[sk]) {
          nearTree = true;
          if (d2 < 70 * 70) clear = false;
        }
        if ((stumps[sk] || logs[sk]) && d2 < 160 * 160) clear = false;
      }
    }
    if (!clear || !nearTree) continue;
    stumps[qi] = 1;
    solid[qi] = 1;
    if (hash2(qx, qy, 135) < 0.6) { mushN[qi] = 3; mushT[qi] = 0; }
    stumpsWanted--;
  }

  // A few fallen-over leafless trees (logs) with edible side mushrooms.
  // Logs lie near standing trees (they fell from them) but never on trunks.
  var logsWanted = 20, logTries = 0;
  while (logsWanted > 0 && logTries < 2000) {
    logTries++;
    var fx = (rand() * W) | 0, fy = (rand() * H) | 0;
    var fi = idx(fx, fy);
    if (biome[fi] !== GRASS || trees[fi] || bushes[fi] || stumps[fi] || logs[fi]) continue;
    var fdx = fx - spawn.x, fdy = fy - spawn.y;
    if (fdx * fdx + fdy * fdy < 64) continue;
    var nearTree = false, fok = true;
    for (var ly3 = fy - 4; ly3 <= fy + 4 && fok; ly3++) {
      for (var lx3 = fx - 4; lx3 <= fx + 4 && fok; lx3++) {
        if (!inBounds(lx3, ly3)) continue;
        var lk = idx(lx3, ly3);
        if (!trees[lk] && !stumps[lk] && !logs[lk]) continue;
        var edx = (fx - lx3) * TILE, edy = (fy - ly3) * TILE;
        var ed2 = edx * edx + edy * edy;
        if (trees[lk]) {
          if (ed2 < 45 * 45) { fok = false; break; }
          nearTree = true;
        }
        if ((stumps[lk] || logs[lk]) && ed2 < 150 * 150) fok = false;
      }
    }
    if (!fok || !nearTree) continue;
    logs[fi] = 1;
    solid[fi] = 1;
    mushN[fi] = 3;
    mushT[fi] = 0;
    logsWanted--;
  }

  buildMinimap();
  return spawn;
}

// ---------- Minimap ----------
var mapCanvas = document.createElement('canvas');
mapCanvas.width = W; mapCanvas.height = H;
function buildMinimap() {
  var ctx = mapCanvas.getContext('2d');
  var img = ctx.createImageData(W, H);
  for (var y = 0; y < H; y++) {
    for (var x = 0; x < W; x++) {
      var i = idx(x, y), o = i * 4;
      var r = 60, g = 179, b = 113;
      if (biome[i] === OCEAN) { r = 20; g = 60; b = 140; }
      else if (biome[i] === WATER) { r = 52; g = 152; b = 219; }
      else if (biome[i] === SAND) { r = 244; g = 226; b = 133; }
      else if (trees[i]) { r = 20; g = 90; b = 40; }
      else if (stumps[i]) { r = 122; g = 90; b = 60; }
      else if (logs[i]) { r = 110; g = 80; b = 50; }
      img.data[o] = r; img.data[o + 1] = g; img.data[o + 2] = b; img.data[o + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}

// ---------- Canvas / input ----------
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var dpr = 1, vw = 0, vh = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  vw = window.innerWidth; vh = window.innerHeight;
  canvas.width = Math.floor(vw * dpr);
  canvas.height = Math.floor(vh * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

var keys = {};
window.addEventListener('keydown', function (e) {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].indexOf(e.key) !== -1) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
});
window.addEventListener('keyup', function (e) { keys[e.key.toLowerCase()] = false; });

// Touch joystick
var joy = { active: false, id: null, bx: 0, by: 0, dx: 0, dy: 0 };
canvas.addEventListener('touchstart', function (e) {
  e.preventDefault();
  if (joy.active) return;
  var t = e.changedTouches[0];
  joy.active = true; joy.id = t.identifier;
  joy.bx = t.clientX; joy.by = t.clientY; joy.dx = 0; joy.dy = 0;
}, { passive: false });
canvas.addEventListener('touchmove', function (e) {
  e.preventDefault();
  for (var i = 0; i < e.changedTouches.length; i++) {
    var t = e.changedTouches[i];
    if (t.identifier !== joy.id) continue;
    var dx = t.clientX - joy.bx, dy = t.clientY - joy.by;
    var len = Math.hypot(dx, dy), max = 55;
    if (len > max) { dx = dx / len * max; dy = dy / len * max; }
    joy.dx = dx / max; joy.dy = dy / max;
  }
}, { passive: false });
function joyEnd(e) {
  for (var i = 0; i < e.changedTouches.length; i++) {
    if (e.changedTouches[i].identifier === joy.id) {
      joy.active = false; joy.dx = 0; joy.dy = 0;
    }
  }
}
canvas.addEventListener('touchend', joyEnd);
canvas.addEventListener('touchcancel', joyEnd);

// ---------- Player ----------
var player = { x: 0, y: 0, r: 9, fx: 0, fy: 1 };
var spawnTile = generate(seed);
player.x = (spawnTile.x + 0.5) * TILE;
player.y = (spawnTile.y + 0.5) * TILE;
var cam = { x: 0, y: 0 };
var coordsEl = document.getElementById('coords');
var berriesEl = document.getElementById('berries');
var hiddenEl = document.getElementById('hidden-badge');
var shroomsEl = document.getElementById('shrooms');
document.getElementById('new-world').addEventListener('click', function () {
  spawnTile = generate((Math.random() * 1e9) | 0);
  player.x = (spawnTile.x + 0.5) * TILE;
  player.y = (spawnTile.y + 0.5) * TILE;
  score = 0;
  berriesEl.textContent = '🫐 Berries: 0';
  mushScore = 0;
  shroomsEl.textContent = '🍄 Mushrooms: 0';
});

function treeScale(tx, ty) { return 1.5 + hash2(tx, ty, 41) * 0.5; } // 1.5 - 2.0x
function bushScale(tx, ty) { return 1.4 + hash2(tx, ty, 83) * 0.6; } // 1.4 - 2.0x
function logScale(tx, ty) { return 1 + hash2(tx, ty, 131) * 0.5; } // 1x - 1.5x
function mushScale(tx, ty, k) { return 0.8 + hash2(tx + k * 13, ty + k * 29, 133) * 0.5; } // 0.8x - 1.3x
function mushPos(tx, ty, k) {
  var sc = logScale(tx, ty);
  var cx = (tx + 0.5) * TILE, cy = (ty + 0.5) * TILE;
  var horiz = hash2(tx, ty, 121) < 0.5;
  var side = hash2(tx, ty, 122) < 0.5 ? 1 : -1;
  var a = (k - 1) * 12 * sc;
  return horiz ? { x: cx + a, y: cy + side * 11 * sc } : { x: cx + side * 11 * sc, y: cy + a };
}
function shroomPos(tx, ty, k) {
  if (logs[idx(tx, ty)]) return mushPos(tx, ty, k);
  var cx = (tx + 0.5) * TILE, cy = (ty + 0.5) * TILE;
  var a = hash2(tx, ty, 137) * Math.PI * 2 + k * 2.1;
  return { x: cx + Math.cos(a) * 12, y: cy + Math.sin(a) * 12 };
}

function hitsSolid(px, py) {
  var r = player.r - 3;
  var x0 = Math.floor((px - r) / TILE), x1 = Math.floor((px + r) / TILE);
  var y0 = Math.floor((py - r) / TILE), y1 = Math.floor((py + r) / TILE);
  for (var ty = y0; ty <= y1; ty++) {
    for (var tx = x0; tx <= x1; tx++) {
      if (!inBounds(tx, ty)) return true;
      var ti = idx(tx, ty);
      if (solid[ti]) {
        if (trees[ti] || stumps[ti]) {
          // only the trunk / stump core is solid — you can slip under leaves
          var tcx = tx * TILE + TILE / 2, tcy = ty * TILE + TILE / 2;
          var trad = trees[ti] ? 7 * treeScale(tx, ty) : 7;
          var tdx = px - tcx, tdy = py - tcy, trr = r + trad;
          if (tdx * tdx + tdy * tdy < trr * trr) return true;
        } else if (logs[ti]) {
          // fallen log: capsule (segment) collision, scaled with the log
          var lsc = logScale(tx, ty);
          var lhoriz = hash2(tx, ty, 121) < 0.5;
          var lcx = tx * TILE + TILE / 2, lcy = ty * TILE + TILE / 2;
          var lex = lhoriz ? 15 * lsc : 0, ley = lhoriz ? 0 : 15 * lsc;
          var lvx = 2 * lex, lvy = 2 * ley;
          var lwx = px - (lcx - lex), lwy = py - (lcy - ley);
          var lc1 = lwx * lvx + lwy * lvy;
          var lc2 = lvx * lvx + lvy * lvy;
          var ltt = lc2 > 0 ? Math.max(0, Math.min(1, lc1 / lc2)) : 0;
          var ldx = lwx - ltt * lvx, ldy = lwy - ltt * lvy;
          if (ldx * ldx + ldy * ldy < (r + 8 * lsc) * (r + 8 * lsc)) return true;
        } else {
          // circle vs tile rect
          var nx = Math.max(tx * TILE, Math.min(px, tx * TILE + TILE));
          var ny = Math.max(ty * TILE, Math.min(py, ty * TILE + TILE));
          var dx = px - nx, dy = py - ny;
          if (dx * dx + dy * dy < r * r) return true;
        }
      }
    }
  }
  return false;
}

function update(dt) {
  var dx = 0, dy = 0;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;
  if (joy.active) { dx += joy.dx; dy += joy.dy; }
  var len = Math.hypot(dx, dy);
  if (len > 1) { dx /= len; dy /= len; }
  if (len > 0.01) { player.fx = dx / (len > 1 ? 1 : len); player.fy = dy / (len > 1 ? 1 : len); }
  var speed = (keys['shift'] ? 340 : 220) * dt;
  var nx = player.x + dx * speed;
  if (!hitsSolid(nx, player.y)) player.x = nx;
  var ny = player.y + dy * speed;
  if (!hitsSolid(player.x, ny)) player.y = ny;
  player.x = Math.max(player.r, Math.min(WORLD_PX - player.r, player.x));
  player.y = Math.max(player.r, Math.min(WORLD_PY - player.r, player.y));

  // Berries regrow over time (mope.io style)
  for (var bi = 0; bi < W * H; bi++) {
    if (bushes[bi] && berryN[bi] < 3) {
      berryT[bi] += dt;
      if (berryT[bi] > 20) { berryN[bi]++; berryT[bi] = 0; }
    }
    if ((logs[bi] || stumps[bi]) && mushN[bi] < 3) {
      mushT[bi] += dt;
      if (mushT[bi] > 20) { mushN[bi]++; mushT[bi] = 0; }
    }
  }
  // Munch berries by touching a bush
  eatCd = Math.max(0, eatCd - dt);
  if (eatCd <= 0) {
    var ptx = Math.floor(player.x / TILE), pty = Math.floor(player.y / TILE);
    for (var ey = pty - 1; ey <= pty + 1 && eatCd <= 0; ey++) {
      for (var ex = ptx - 1; ex <= ptx + 1; ex++) {
        if (!inBounds(ex, ey)) continue;
        var ei = idx(ex, ey);
        if (!bushes[ei] || !berryN[ei]) continue;
        var bcx = (ex + 0.5) * TILE, bcy = (ey + 0.5) * TILE;
        var bdx = player.x - bcx, bdy = player.y - bcy;
        if (bdx * bdx + bdy * bdy < (player.r + 15) * (player.r + 15)) {
          berryN[ei]--;
          if (berryN[ei] < 3 && berryT[ei] > 20) berryT[ei] = 0;
          if (!berryN[ei]) berryT[ei] = 0;
          score++;
          eatCd = 0.25;
          berriesEl.textContent = '🫐 Berries: ' + score;
          break;
        }
      }
    }
  }
  // Munch mushrooms growing on fallen logs and stumps
  if (eatCd <= 0) {
    for (var my = pty - 1; my <= pty + 1 && eatCd <= 0; my++) {
      for (var mx = ptx - 1; mx <= ptx + 1; mx++) {
        if (!inBounds(mx, my)) continue;
        var mi = idx(mx, my);
        if ((!logs[mi] && !stumps[mi]) || !mushN[mi]) continue;
        for (var mk = 0; mk < mushN[mi]; mk++) {
          var mp = shroomPos(mx, my, mk);
          var mdx = player.x - mp.x, mdy = player.y - mp.y;
          if (mdx * mdx + mdy * mdy < (player.r + 10) * (player.r + 10)) {
            mushN[mi]--;
            if (!mushN[mi]) mushT[mi] = 0;
            mushScore++;
            eatCd = 0.25;
            shroomsEl.textContent = '🍄 Mushrooms: ' + mushScore;
            break;
          }
        }
      }
    }
  }

  var viewW = vw / ZOOM, viewH = vh / ZOOM;
  cam.x = Math.max(0, Math.min(WORLD_PX - viewW, player.x - viewW / 2));
  cam.y = Math.max(0, Math.min(WORLD_PY - viewH, player.y - viewH / 2));

  // Hiding: all the way under a canopy (hugging the trunk) conceals you
  var hiding = false;
  var htx = Math.floor(player.x / TILE), hty = Math.floor(player.y / TILE);
  for (var hy = hty - 1; hy <= hty + 1 && !hiding; hy++) {
    for (var hx = htx - 1; hx <= htx + 1; hx++) {
      if (!inBounds(hx, hy) || !trees[idx(hx, hy)]) continue;
      var hsc = treeScale(hx, hy);
      var hdx = player.x - (hx + 0.5) * TILE, hdy = player.y - (hy + 0.5) * TILE;
      var hr = 16 + 7 * hsc;
      if (hdx * hdx + hdy * hdy < hr * hr) { hiding = true; break; }
    }
  }
  // Hiding in a bush: fully inside big foliage conceals you too
  if (!hiding) {
    for (var by = hty - 1; by <= hty + 1 && !hiding; by++) {
      for (var bx = htx - 1; bx <= htx + 1; bx++) {
        if (!inBounds(bx, by) || !bushes[idx(bx, by)]) continue;
        var bsc = bushScale(bx, by);
        var bdx = player.x - (bx + 0.5) * TILE, bdy = player.y - (by + 0.5) * TILE;
        if (Math.hypot(bdx, bdy) < 14 * bsc - player.r) { hiding = true; break; }
      }
    }
  }
  playerA += ((hiding ? 0.15 : 1) - playerA) * Math.min(1, dt * 8);
  if (hiding !== wasHiding) {
    wasHiding = hiding;
    hiddenEl.style.display = hiding ? 'block' : 'none';
  }
  coordsEl.textContent = 'x: ' + Math.floor(player.x / TILE) + ', y: ' + Math.floor(player.y / TILE);
}

// ---------- Drawing ----------
function shade(base, amt) {
  return 'rgb(' + Math.max(0, Math.min(255, base[0] + amt)) + ',' +
         Math.max(0, Math.min(255, base[1] + amt)) + ',' +
         Math.max(0, Math.min(255, base[2] + amt)) + ')';
}
var C_OCEAN = [22, 68, 150], C_WATER = [52, 152, 219],
    C_SAND = [238, 220, 130], C_GRASS = [62, 172, 100];

function drawTree(sx, sy, tx, ty, leafAlpha, trunkAlpha) {
  // Top-down canopy seen from directly above: leaves only.
  // Trunk is just a circle in the middle, shown only when under the tree.
  // Every tree gets its own size (1x - 1.35x) and slight look.
  var sc = treeScale(tx, ty);
  var pal = (hash2(tx, ty, 43) * 3) | 0;
  var dark = pal === 2 ? '#0f4d2e' : (pal === 1 ? '#174d1f' : '#14521f');
  var mid = pal === 2 ? '#1b7a3d' : (pal === 1 ? '#237a35' : '#1e6b2e');
  var light = pal === 2 ? '#43b953' : (pal === 1 ? '#37ad4c' : '#2fa143');
  function j(s) { return (hash2(tx, ty, s) - 0.5) * 7; }
  function blob(dx, dy, r, c) {
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(sx + dx * sc, sy + dy * sc, r * sc, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = leafAlpha;
  blob(-11 + j(51), -2 + j(52), 13, dark);
  blob(11 + j(53), -2 + j(54), 13, dark);
  blob(j(55), -12 + j(56), 14, dark);
  blob(j(57), 9 + j(58), 13, dark);
  blob(-7 + j(59), -5 + j(60), 10, mid);
  blob(8 + j(61), -6 + j(62), 10, mid);
  blob(j(63), 3 + j(64), 10, mid);
  blob(-4 + j(65), -9 + j(66), 5, light);
  blob(6 + j(67), 1 + j(68), 4, light);
  if (hash2(tx, ty, 69) < 0.5) blob(2 + j(70), -14 + j(71), 7, mid);
  // the log only shows when you are under the tree
  if (trunkAlpha > 0.01) {
    ctx.globalAlpha = trunkAlpha;
    ctx.fillStyle = '#8a5a33';
    ctx.strokeStyle = '#5d3a1a';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(sx, sy, 6 * sc, 0, 7); ctx.fill(); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function drawBush(sx, sy, tx, ty, n) {
  // Every bush gets its own size (0.75x - 1.25x) and slight look
  var sc = bushScale(tx, ty);
  var pal = (hash2(tx, ty, 85) * 3) | 0;
  var base = pal === 2 ? '#2a8a3e' : (pal === 1 ? '#37ad4c' : '#2f9e44');
  var dark = '#1d6b2c';
  function j(s) { return (hash2(tx, ty, s) - 0.5) * 6; }
  function puff(dx, dy, r) {
    ctx.fillStyle = base;
    ctx.strokeStyle = dark;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(sx + dx * sc, sy + dy * sc, r * sc, 0, 7); ctx.fill(); ctx.stroke();
  }
  puff(-6 + j(87), 3 + j(88), 8);
  puff(6 + j(89), 3 + j(90), 8);
  puff(j(91), -4 + j(92), 9);
  if (hash2(tx, ty, 93) < 0.5) puff(3 + j(94), 6 + j(95), 6);
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath(); ctx.arc(sx - 3 * sc, sy - 6 * sc, 3 * sc, 0, 7); ctx.fill();
  ctx.fillStyle = '#e1306c';
  ctx.strokeStyle = '#a3123f';
  ctx.lineWidth = 1.5;
  for (var k = 0; k < n; k++) {
    var a = hash2(tx + k * 13, ty + k * 29, 77) * Math.PI * 2;
    var bx = sx + Math.cos(a) * 8 * sc, by = sy - 1 + Math.sin(a) * 7 * sc;
    ctx.beginPath(); ctx.arc(bx, by, 3, 0, 7); ctx.fill(); ctx.stroke();
  }
}
function drawStump(sx, sy, tx, ty) {
  // Old stump seen from above: bark ring around wood with growth rings
  var sc = 0.9 + hash2(tx, ty, 111) * 0.2;
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(sx, sy + 9 * sc, 10 * sc, 4 * sc, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#6b4a2b';
  ctx.strokeStyle = '#4a2f18';
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(sx, sy, 11 * sc, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#c9a06a';
  ctx.beginPath(); ctx.arc(sx, sy, 7.5 * sc, 0, 7); ctx.fill();
  ctx.strokeStyle = '#a37c4e';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(sx, sy, 5 * sc, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.arc(sx, sy, 2.8 * sc, 0, 7); ctx.stroke();
  var ca = hash2(tx, ty, 113) * Math.PI * 2;
  ctx.strokeStyle = '#6b4a2b';
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.lineTo(sx + Math.cos(ca) * 7 * sc, sy + Math.sin(ca) * 7 * sc);
  ctx.stroke();
  var sn = mushN[idx(tx, ty)];
  for (var q = 0; q < sn; q++) {
    var sp = shroomPos(tx, ty, q);
    drawShroom(sp.x, sp.y, mushScale(tx, ty, q));
  }
}
function drawShroom(x, y, s) {
  s = s || 1;
  ctx.fillStyle = '#f5ead2';
  ctx.beginPath(); ctx.arc(x, y + 1.5 * s, 2.5 * s, 0, 7); ctx.fill();
  ctx.fillStyle = '#d63d2f';
  ctx.strokeStyle = '#8e1f16';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(x, y - 1 * s, 4 * s, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(x - 1.2 * s, y - 2 * s, 1 * s, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 1.5 * s, y - 0.5 * s, 0.8 * s, 0, 7); ctx.fill();
}
function drawLog(sx, sy, tx, ty) {
  // Fallen leafless tree lying on its side, mushrooms along one flank.
  // Every log gets its own size (1x - 1.5x) and bark tint; some grow moss.
  var horiz = hash2(tx, ty, 121) < 0.5;
  var sc = logScale(tx, ty);
  var L = 23 * sc, R = 8 * sc;
  var barkD = '#4a2f18', barkL = '#7a5230';
  var bv = hash2(tx, ty, 139);
  if (bv < 0.33) { barkD = '#4a4038'; barkL = '#7a6a58'; }
  else if (bv < 0.66) { barkD = '#5a2f1a'; barkL = '#8a5a30'; }
  function P(ax, ay) { return horiz ? [sx + ax, sy + ay] : [sx + ay, sy + ax]; }
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(sx, sy + R, L, 4, 0, 0, 7); ctx.fill();
  var a = P(-L, 0), b = P(L, 0);
  ctx.strokeStyle = barkD;
  ctx.lineWidth = R * 2 + 3;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  ctx.strokeStyle = barkL;
  ctx.lineWidth = R * 2 - 2;
  ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  if (hash2(tx, ty, 141) < 0.45) {
    // mossy patch on top
    var ma = P((hash2(tx, ty, 143) - 0.5) * L, -R * 0.55);
    ctx.fillStyle = '#4d8a3c';
    ctx.beginPath(); ctx.ellipse(ma[0], ma[1], 9 * sc, 4 * sc, horiz ? 0.15 : 1.4, 0, 7); ctx.fill();
  }
  var ends = [P(-L, 0), P(L, 0)];
  for (var e = 0; e < 2; e++) {
    ctx.fillStyle = '#c9a06a';
    ctx.strokeStyle = '#8a5a33';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ends[e][0], ends[e][1], R - 1.5, 0, 7); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#a37c4e';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(ends[e][0], ends[e][1], (R - 1.5) * 0.55, 0, 7); ctx.stroke();
  }
  // snapped branch nub on the opposite side from the mushrooms
  var side = hash2(tx, ty, 122) < 0.5 ? 1 : -1;
  var off = (hash2(tx, ty, 123) - 0.5) * 20 * sc;
  var n0 = horiz ? [sx + off, sy - side * R] : [sx - side * R, sy + off];
  var n1 = horiz ? [sx + off, sy - side * (R + 7)] : [sx - side * (R + 7), sy + off];
  ctx.strokeStyle = barkD;
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(n0[0], n0[1]); ctx.lineTo(n1[0], n1[1]); ctx.stroke();
  var mn = mushN[idx(tx, ty)];
  for (var k = 0; k < mn; k++) {
    var mp = mushPos(tx, ty, k);
    drawShroom(mp.x, mp.y, mushScale(tx, ty, k)); // world coords, zoom transform is active
  }
}
function drawPlayer(sx, sy, t) {
  // Small round explorer (smaller than a tree); fades when hiding
  ctx.globalAlpha = playerA;
  var bob = Math.sin(t / 130) * 1.2;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(sx, sy + 9, 8, 3.5, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#2196f3';
  ctx.strokeStyle = '#0d47a1';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(sx, sy + bob * 0.4, 9, 0, 7); ctx.fill(); ctx.stroke();
  // eyes look toward movement
  var ex = -player.fy, ey = player.fx;
  var cx = sx + player.fx * 3.5, cy = sy + bob * 0.4 + player.fy * 3.5;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(cx + ex * 3.6, cy + ey * 3.6, 2.6, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(cx - ex * 3.6, cy - ey * 3.6, 2.6, 0, 7); ctx.fill();
  ctx.fillStyle = '#10233f';
  ctx.beginPath(); ctx.arc(cx + ex * 3.6 + player.fx, cy + ey * 3.6 + player.fy, 1.3, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(cx - ex * 3.6 + player.fx, cy - ey * 3.6 + player.fy, 1.3, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
}

function render(t, rdt) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#0b1020';
  ctx.fillRect(0, 0, vw, vh);
  var viewW = vw / ZOOM, viewH = vh / ZOOM;
  var x0 = Math.max(0, Math.floor(cam.x / TILE));
  var y0 = Math.max(0, Math.floor(cam.y / TILE));
  var x1 = Math.min(W - 1, Math.ceil((cam.x + viewW) / TILE));
  var y1 = Math.min(H - 1, Math.ceil((cam.y + viewH) / TILE));
  var x, y;
  ctx.setTransform(dpr * ZOOM, 0, 0, dpr * ZOOM, -cam.x * dpr * ZOOM, -cam.y * dpr * ZOOM);

  for (y = y0; y <= y1; y++) {
    for (x = x0; x <= x1; x++) {
      var i = idx(x, y);
      var b = biome[i];
      var sx = x * TILE, sy = y * TILE;
      var v = hash2(x, y, 21) - 0.5;
      if (b === OCEAN) ctx.fillStyle = shade(C_OCEAN, v * 12);
      else if (b === WATER) ctx.fillStyle = shade(C_WATER, v * 12);
      else if (b === SAND) ctx.fillStyle = shade(C_SAND, v * 14);
      else ctx.fillStyle = shade(C_GRASS, v * 16);
      ctx.fillRect(sx, sy, TILE + 1, TILE + 1);

      if (b === WATER || b === OCEAN) {
        // gentle shimmer
        if (hash2(x, y, 22) < 0.18) {
          var ph = Math.sin(t / 700 + x * 1.3 + y * 0.7);
          ctx.strokeStyle = 'rgba(255,255,255,' + (0.10 + 0.08 * ph).toFixed(3) + ')';
          ctx.lineWidth = 2;
          ctx.beginPath();
          var wy = sy + 8 + hash2(x, y, 23) * 16;
          ctx.moveTo(sx + 5, wy);
          ctx.quadraticCurveTo(sx + 12, wy - 3 + ph * 2, sx + 19, wy);
          ctx.quadraticCurveTo(sx + 24, wy + 3 - ph * 2, sx + 28, wy);
          ctx.stroke();
        }
      } else if (b === GRASS) {
        if (hash2(x, y, 24) < 0.55 && !trees[i] && !bushes[i]) {
          ctx.strokeStyle = 'rgba(20,90,40,0.7)';
          ctx.lineWidth = 2;
          var gx = sx + 6 + hash2(x, y, 25) * 20;
          var gy = sy + 6 + hash2(x, y, 26) * 20;
          ctx.beginPath();
          ctx.moveTo(gx, gy); ctx.lineTo(gx - 2, gy - 6);
          ctx.moveTo(gx + 5, gy + 1); ctx.lineTo(gx + 7, gy - 5);
          ctx.stroke();
        }
        if (litter[i] === 3) {
          // fallen stick with a tiny twig
          var sa = hash2(x, y, 105) * Math.PI;
          var lxs = sx + 7 + hash2(x, y, 103) * 18, lys = sy + 7 + hash2(x, y, 104) * 18;
          ctx.strokeStyle = '#7a5230';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(lxs - Math.cos(sa) * 6, lys - Math.sin(sa) * 6);
          ctx.lineTo(lxs + Math.cos(sa) * 6, lys + Math.sin(sa) * 6);
          ctx.stroke();
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(lxs + 1, lys - 1);
          ctx.lineTo(lxs + 5, lys - 5);
          ctx.stroke();
        } else if (litter[i]) {
          // fallen leaf
          var la = hash2(x, y, 106) * Math.PI;
          ctx.fillStyle = litter[i] === 1 ? '#6fae3f' : '#3c8c3f';
          ctx.beginPath();
          ctx.ellipse(sx + 7 + hash2(x, y, 103) * 18, sy + 7 + hash2(x, y, 104) * 18, 4.5, 2.8, la, 0, 7);
          ctx.fill();
        }
      } else if (b === SAND) {
        if (hash2(x, y, 27) < 0.4) {
          ctx.fillStyle = 'rgba(190,170,100,0.6)';
          ctx.fillRect(sx + hash2(x, y, 28) * 26 + 2, sy + hash2(x, y, 29) * 26 + 2, 3, 3);
        }
      }
    }
  }

  // Y-sorted bushes + player (world coords; zoom transform is active)
  var px = player.x, py = player.y;
  var drewPlayer = false;
  var drawables = [];
  for (y = y0; y <= y1; y++) {
    for (x = x0; x <= x1; x++) {
      var j = idx(x, y);
      if (bushes[j] || stumps[j] || logs[j]) drawables.push([y * TILE + 12, x, y]);
    }
  }
  drawables.sort(function (a, b2) { return a[0] - b2[0]; });
  for (var d = 0; d < drawables.length; d++) {
    var oy = drawables[d][0];
    if (!drewPlayer && player.y < oy) { drawPlayer(px, py, t); drewPlayer = true; }
    var ox = drawables[d][1] * TILE + TILE / 2;
    var oyy = drawables[d][2] * TILE + TILE / 2;
    var btx = drawables[d][1], bty = drawables[d][2];
    var bti2 = idx(btx, bty);
    if (stumps[bti2]) drawStump(ox, oyy, btx, bty);
    else if (logs[bti2]) drawLog(ox, oyy, btx, bty);
    else drawBush(ox, oyy, btx, bty, berryN[bti2]);
  }
  if (!drewPlayer) drawPlayer(px, py, t);

  // Tree canopies seen straight from above, always drawn above the player.
  // They fade when you slip underneath so you can still see yourself.
  for (var ty2 = y0; ty2 <= y1; ty2++) {
    for (var tx2 = x0; tx2 <= x1; tx2++) {
      var k = idx(tx2, ty2);
      if (!trees[k]) continue;
      var tsc = treeScale(tx2, ty2);
      var ccx = tx2 * TILE + TILE / 2, ccy = ty2 * TILE + TILE / 2;
      var pdx = player.x - ccx, pdy = player.y - ccy;
      var under = (pdx * pdx + pdy * pdy) < (24 * tsc + 6) * (24 * tsc + 6);
      var target = under ? 0.45 : 1;
      treeA[k] += (target - treeA[k]) * Math.min(1, rdt * 10);
      var trunkTarget = under ? 1 : 0;
      trunkA[k] += (trunkTarget - trunkA[k]) * Math.min(1, rdt * 10);
      drawTree(ccx, ccy, tx2, ty2, treeA[k], trunkA[k]);
    }
  }

  // Screen-space UI (joystick, minimap)
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Touch joystick visual
  if (joy.active) {
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(joy.bx, joy.by, 55, 0, 7); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath(); ctx.arc(joy.bx + joy.dx * 55, joy.by + joy.dy * 55, 22, 0, 7); ctx.fill();
  }

  // Minimap
  var mm = 150, mx = vw - mm - 12, my = 12;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(mx - 5, my - 5, mm + 10, mm + 10);
  ctx.drawImage(mapCanvas, mx, my, mm, mm);
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 2;
  ctx.strokeRect(mx - 5, my - 5, mm + 10, mm + 10);
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(mx + (player.x / WORLD_PX) * mm, my + (player.y / WORLD_PY) * mm, 3.5, 0, 7);
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1;
  ctx.stroke();
}

// ---------- Main loop ----------
var last = performance.now();
function loop(now) {
  var dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render(now, dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
