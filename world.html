<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Open World</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b1020;
    font-family: 'Segoe UI', sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #hud {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 10;
    background: rgba(13, 19, 27, 0.93);
    color: #fff;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 0.9rem;
    line-height: 1.5;
    pointer-events: none;
  }
  #hud .title { font-weight: bold; color: #ffd700; font-size: 1rem; }
  #hidden-badge {
    display: none;
    position: fixed;
    top: 184px;
    left: 12px;
    z-index: 10;
    background: rgba(13, 19, 27, 0.93);
    color: #fff;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 0.9rem;
    pointer-events: none;
  }
  #help {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    background: rgba(13, 19, 27, 0.93);
    color: #fff;
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 0.85rem;
    white-space: nowrap;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="title">🌍 Open World</div>
  <div id="coords">x: 0, y: 0</div>
  <div id="berries">🫐 Berries: 0</div>
  <div id="shrooms">🍄 Mushrooms: 0</div>
</div>
<div id="hidden-badge">🤫 Hidden!</div>
<div id="help">WASD / Arrows to walk &nbsp;•&nbsp; Shift to run &nbsp;•&nbsp; Touch: drag to walk</div>
<script>
'use strict';
// ---------- Config ----------
var TILE = 32;
var ZOOM = 1.6; // zoomed-in camera (map layout unchanged)
var W = 240, H = 240;               // decently big, but NOT infinite
var WORLD_PX = W * TILE, WORLD_PY = H * TILE;
var WATER_LEVEL = 0.30;
var SAND_LINE = 0.345;

// Biome ids
var OCEAN = 0, WATER = 1, SAND = 2, GRASS = 3;

// ---------- Deterministic hashing / RNG ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(x, y, s) {
  var h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967295;
}

// ---------- Value noise ----------
var lat = new Float32Array(256);
var perm = new Uint8Array(512);
function seedNoise(rand) {
  var p = [];
  for (var i = 0; i < 256; i++) { p[i] = i; lat[i] = rand(); }
  for (var j = 255; j > 0; j--) {
    var k = (rand() * (j + 1)) | 0;
    var tmp = p[j]; p[j] = p[k]; p[k] = tmp;
  }
  for (var m = 0; m < 512; m++) perm[m] = p[m & 255];
}
function vnoise(x, y) {
  var xi = Math.floor(x), yi = Math.floor(y);
  var xf = x - xi, yf = y - yi;
  var X = xi & 255, Y = yi & 255;
  var v00 = lat[perm[(perm[X] + Y) & 511] & 255];
  var v10 = lat[perm[(perm[(X + 1) & 255] + Y) & 511] & 255];
  var v01 = lat[perm[(perm[X] + Y + 1) & 511] & 255];
  var v11 = lat[perm[(perm[(X + 1) & 255] + Y + 1) & 511] & 255];
  var u = xf * xf * (3 - 2 * xf);
  var v = yf * yf * (3 - 2 * yf);
  return (v00 * (1 - u) + v10 * u) * (1 - v) + (v01 * (1 - u) + v11 * u) * v;
}
function fbm(x, y, oct) {
  var sum = 0, amp = 0.5, f = 1, norm = 0;
  for (var i = 0; i < oct; i++) {
    sum += amp * vnoise(x * f, y * f);
    norm += amp;
    amp *= 0.5;
    f *= 2.03;
  }
  return sum / norm;
}

// ---------- World data ----------
var elev = new Float32Array(W * H);
var biome = new Uint8Array(W * H);   // OCEAN/WATER/SAND/GRASS
var bigLake = new Uint8Array(W * H); // 1 on big-lake water (mid-tone color)
var trees = new Uint8Array(W * H);
var pines = new Uint8Array(W * H); // snowy pine trees in the top-left snow area
var snow = new Uint8Array(W * H); // 1 on snowy land (top-left, grass only)
var ice = new Uint8Array(W * H); // 1 on frozen pond water near the snow
var palms = new Uint8Array(W * H); // coconut palms on ocean beaches + islands
var bushes = new Uint8Array(W * H);
var solid = new Uint8Array(W * H);
var berryN = new Uint8Array(W * H);   // berries currently on a bush (0-3)
var berryT = new Float32Array(W * H); // regrow timer per bush
var litter = new Uint8Array(W * H); // forest floor: 0 none, 1 leaf, 2 leaf, 3 stick
var stumps = new Uint8Array(W * H); // rare old stumps
var shells = new Uint8Array(W * H); // shells on ocean beaches: 0 none, 1 pink, 2 white, 3 purple
var crabHoles = []; // beach crab holes: {x,y,state,timer,cx,cy,tx,ty,pause,heading}
var burrows = []; // bunny burrows in the fields: {x,y,breedT}
var bunnies = []; // field bunnies: {x,y,heading,state,timer,resting,tx,ty,btx,bty,sc,gsc,tone,dark,home,bx,by,baby,age,lifespan,deathT,fade,nibT,craveT,homeT}
var fishes = []; // pond + ocean fish: {x,y,heading,speed,turn,sea}
var ducks = []; // pond ducks: {x,y,heading,speed,turn,state,timer,tx,ty,lwX,lwY,sc,body,head,drake,wake,age,lifespan,nester,nest,layT,deathT,fade,chick,gsc,nx,ny,phase,carry}
var nests = []; // duck nests on shores: {x,y,eggs:[age],clutch,age,mom}
var duckSpots = []; // open pond-water tiles where newcomer ducks paddle in
var DUCK_TONES = [ [ '#8a6f4d', '#6e5739' ], [ '#9aa0a6', '#7c8288' ], [ '#6b5b45', '#52452f' ] ]; // body + head shades
var splashes = []; // wading ripples: {x,y,age,life,maxR}
var noBush = new Uint8Array(W * H); // keep bushes clear of logs/stumps
var open = new Uint8Array(W * H); // open field: grass with no trees nearby
var mushN = new Uint8Array(W * H); // mushrooms on a stump (0-3)
var mushT = new Float32Array(W * H); // mushroom regrow timer
var mushScore = 0;
var seed = 20260906;
var score = 0, eatCd = 0, splashT = 0, duckCheckT = 0, bunCheckT = 0, fishCheckT = 0, hedgeCheckT = 0;
var MIN_POND_FISH = 35; // ponds + lake, always at least this many
var MIN_SEA_FISH = 67; // ocean, always at least this many
var START_BUNNIES = 30; // rabbits alive when the game starts
var START_HEDGE = 30; // hedgehogs alive when the game starts
var MIN_HEDGE = 29; // hedgehog minimum population
var MAX_HEDGE = 50; // hedgehog maximum population
var START_SNOW_HOG = 12; // snowy hedgehogs alive when the game starts
var MIN_SNOW_HOG = 10; // snowy hedgehog minimum population
var pondFishSpots = []; // every iceless WATER tile (refilled in generate)
var seaFishSpots = []; // every open-sea OCEAN tile (refilled in generate)
var hedgehogs = []; // forest + snowy hedgehogs (snow flag marks the white ones)
var hedgeSpots = []; // forest floor tiles hedgehogs can spawn on (refilled in generate)
var snowHogSpots = []; // snowy grass tiles white hedgehogs can spawn on (refilled in generate)
var snowHogCheckT = 0;
var HOG_COUNT = 20; // warthogs: always exactly this many alive + being eaten
var warthogs = []; // savanna warthogs
var HYENA_COUNT = 3; // spotted hyenas: a pack of 3 that hunts warthogs together, never dies
var hyenas = []; // savanna hyenas: {x,y,heading,state,timer,resting,sc,prey,meat,flank,huntCd,biteCd,nibT,step}
var hogCarcasses = []; // dead warthogs being eaten: {x,y,heading,sc,eatT,total,fade}
var hyenaPackTarget = null; // the one warthog the whole pack is chasing right now
var hyenaCheckT = 0;
var ARMADILLO_COUNT = 15; // armadillos: always exactly this many, never breed or die
var armadillos = []; // savanna armadillos
var armCheckT = 0;
var LIZARD_COUNT = 12; // rock-flat lizards: always exactly this many, never breed or die
var lizards = []; // tiny lizards of 3 kinds: {x,y,heading,state,timer,resting,sc,kind,home}
var lizardHoles = []; // tiny holes in the rock flat: {x,y}
var lizCheckT = 0;
var TARANTULA_COUNT = 6; // rock-flat tarantulas: always exactly this many, never breed or die
var tarantulas = []; // big hairy spiders living under boulders: {x,y,heading,state,timer,resting,sc,home}
var boulderSpots = []; // boulder tiles tarantulas hide under (refilled in generate)
var tarCheckT = 0;
var ANT_START = 24; // ants alive when the game starts
var ANT_MIN = 15; // ant minimum population (spider food)
var ants = []; // tiny ants skittering over the rock flat
var antCheckT = 0;
var FROG_COUNT = 18; // swamp frogs: always exactly this many, never breed or die
var frogs = []; // little frogs hopping around the swamp pools and hummocks
var frogSpots = []; // swamp tiles frogs can spawn on (refilled in generate)
var frogCheckT = 0;
var GATOR_COUNT = 2; // big swamp alligators: always exactly 2, never die
var gators = []; // long gators lurking in the swamp, snatching ducks
var gatorSpots = []; // swamp pool tiles gators can spawn on (refilled in generate)
var gatorCheckT = 0;
var habitatCheckT = 0; // habitat audit timer (teleports strays home, eagles exempt)
var hogSpots = []; // savanna grass tiles warthogs can spawn on (refilled in generate)
var hogCheckT = 0;
var playerA = 1, wasHiding = false;
var iceVx = 0, iceVy = 0; // skating momentum while sliding on ice
var treeA = new Float32Array(W * H).fill(1); // canopy fade per tree
var pineA = new Float32Array(W * H).fill(1); // canopy fade per pine
var pineTrunkA = new Float32Array(W * H); // trunk shows only when under the pine
var palmA = new Float32Array(W * H).fill(1); // frond fade per palm
var palmTrunkA = new Float32Array(W * H); // trunk ring shows only when under the palm
var trunkA = new Float32Array(W * H); // trunk shows only when under the tree
var bushA = new Float32Array(W * H).fill(1); // bush fade when inside one
var sav = new Uint8Array(W * H); // 1 on dry savanna grassland (top-right)
var stumpKind = new Uint8Array(W * H); // 0 none, 1 forest, 2 pine, 3 acacia
var des = new Uint8Array(W * H); // 1 on desert sand (small desert by the savanna)
var swp = new Uint8Array(W * H); // 1 on swamp ground (middle-left, pools + wet hummocks)
var volc = new Uint8Array(W * H); // 1 on the volcano cone (middle of the map, basalt slopes)
var lava = new Uint8Array(W * H); // 1 on molten lava (crater pool, vents, rivers: impassable, no fish/ducks)
var rock = new Uint8Array(W * H); // 1 on the rocky flat ground (top-middle)
var boulder = new Uint8Array(W * H); // big impassable boulders on the rock flat
var cactus = new Uint8Array(W * H); // cacti standing in the desert
var deadTree = new Uint8Array(W * H); // dead trees in the desert (no hiding)
var JACK_START = 40; // jackrabbits alive when the game starts
var JACK_MIN = 30; // jackrabbit minimum population
var JACK_MAX = 60; // jackrabbit maximum population
var SNAKE_COUNT = 10; // rattlesnakes: always exactly this many, never die
var secretary = null; // the one and only desert secretary bird (stomps snakes)
var VULTURE_COUNT = 8; // vultures: always exactly this many, circle the desert, never die
var SNOWY_OWL_COUNT = 15; // snowy owls: always exactly this many, roam the snow, never die
var HAWK_COUNT = 8; // hawks: always exactly this many, roam plains and forests, never die
var SEAGULL_COUNT = 58; // seagulls: always exactly this many, roam the ocean, never die
var SEATURTLE_COUNT = 25; // sea turtle shadows: always exactly this many, glide under the ocean, never die
var DOLPHIN_COUNT = 20; // dolphin shadows: always exactly this many, roam the ocean, never die
var turtleNests = []; // beach nests with eggs: {x,y,timer,mom}
var beachSpots = []; // beach sand tiles turtles can nest on (refilled in generate)
var jackBurrows = []; // jackrabbit burrows in the desert sand
var jacks = []; // desert jackrabbits (big ears, never eat)
var snakeHoles = []; // rattlesnake burrows in the sand
var snakes = []; // desert rattlesnakes
var vultures = []; // desert vultures circling overhead
var cactusSpots = []; // cactus tiles vultures can perch on (refilled in generate)
var carcasses = []; // dead jackrabbits vultures scavenge: {x,y,meat,rot,fade,...}
var snowyOwls = []; // snowy owls roaming overhead in the snow
var pineSpots = []; // pine tiles owls can perch on (refilled in generate)
var hawks = []; // red-tailed hawks roaming the plains and forests
var hawkSpots = []; // regular tree tiles hawks can perch on (refilled in generate)
var EAGLE_COUNT = 3; // eagles: always exactly this many, roam the whole map, never die
var eagles = []; // map-wide hunting eagles: fish, rabbits, hedgehogs, snakes, tarantulas, lizards, jackrabbits, frogs, ducks, armadillos, seagulls
var treeSpots = []; // tree + pine tiles eagles carry prey to (refilled in generate)
var dragon = null; // the one massive volcano dragon: eats anything that comes close, never leaves, never dies
var volcCx = 0, volcCy = 0; // volcano middle in px (computed in generate)
var jackCheckT = 0, snakeCheckT = 0, vultCheckT = 0, owlCheckT = 0, hawkCheckT = 0, gullCheckT = 0, turtleCheckT = 0, dolphinCheckT = 0, eagleCheckT = 0;
var seagulls = []; // seagulls roaming overhead over the ocean
var seaTurtles = []; // sea turtle shadows gliding under the ocean water
var dolphins = []; // dolphin shadows roaming under the ocean water
var desSpots = []; // desert sand tiles snakes can spawn on (refilled in generate)
var acacias = new Uint8Array(W * H); // umbrella acacia trees on the savanna
var deadB = new Uint8Array(W * H); // dead bushes on the savanna
var acaciaA = new Float32Array(W * H).fill(1); // canopy fade per acacia
var acaciaTrunkA = new Float32Array(W * H); // trunk shows only when under the acacia
var mud = new Uint8Array(W * H); // 1 on muddy dried-pond flats (slow, no fish/ducks)

function idx(x, y) { return y * W + x; }
function inBounds(x, y) { return x >= 0 && y >= 0 && x < W && y < H; }

function generate(s) {
  seed = s;
  var rand = mulberry32(seed);
  seedNoise(rand);
  var x, y;

  // Elevation with island falloff (ocean at the edges)
  for (y = 0; y < H; y++) {
    for (x = 0; x < W; x++) {
      var base = fbm(x * 0.014, y * 0.014, 4);
      base += 0.15 * fbm(x * 0.06 + 40, y * 0.06 + 40, 2);
      var dx = (x - W / 2) / (W / 2);
      var dy = (y - H / 2) / (H / 2);
      var d = Math.sqrt(dx * dx + dy * dy) / Math.SQRT2;
      var elevV = base + 0.06 - Math.pow(d, 2.1) * 0.72;
      // Northern sea: dip the far north below the waves so the island sits
      // off the top frame. Its reach varies along x, so the new coast is a
      // curvy shoreline with bays and points instead of a straight cut.
      var northR = 26 + 30 * fbm(x * 0.02 + 7.3, 3.1, 3);
      if (y < northR) {
        var nt = 1 - y / northR;
        elevV -= 0.34 * nt * nt;
      }
      elev[idx(x, y)] = elevV;
    }
  }

  // Base water vs land
  for (var i = 0; i < W * H; i++) {
    biome[i] = elev[i] < WATER_LEVEL ? WATER : GRASS;
  }

  // (No rivers — lakes and ocean only)

  // Ocean = water connected to the map border (flood fill); inland water stays lakes
  var stack = [];
  for (x = 0; x < W; x++) { stack.push([x, 0]); stack.push([x, H - 1]); }
  for (y = 0; y < H; y++) { stack.push([0, y]); stack.push([W - 1, y]); }
  while (stack.length) {
    var c = stack.pop();
    var qx2 = c[0], qy2 = c[1];
    if (!inBounds(qx2, qy2)) continue;
    var ii = idx(qx2, qy2);
    if (biome[ii] !== WATER || solid[ii] === 2) continue;
    biome[ii] = OCEAN;
    solid[ii] = 2; // visited marker reused below
    stack.push([qx2 + 1, qy2]); stack.push([qx2 - 1, qy2]);
    stack.push([qx2, qy2 + 1]); stack.push([qx2, qy2 - 1]);
  }

  // Connect all ocean parts so the ocean is a single connected body.
  // Land bridges to the edge can split border water into separate OCEAN
  // patches — carve a winding, valley-following strait between them so the
  // new shoreline looks like a drowned river valley, not a straight canal.
  (function connectOceans() {
    function labelComps() {
      var comp = new Int32Array(W * H).fill(-1);
      var sizes = [];
      var n = 0;
      var d4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      for (var ly = 0; ly < H; ly++) {
        for (var lx = 0; lx < W; lx++) {
          var li0 = idx(lx, ly);
          if (biome[li0] !== OCEAN || comp[li0] !== -1) continue;
          var q2 = [[lx, ly]];
          comp[li0] = n;
          var sz = 0;
          while (q2.length) {
            var cc = q2.pop();
            sz++;
            for (var k = 0; k < 4; k++) {
              var nnx = cc[0] + d4[k][0], nny = cc[1] + d4[k][1];
              if (!inBounds(nnx, nny)) continue;
              var nni = idx(nnx, nny);
              if (biome[nni] !== OCEAN || comp[nni] !== -1) continue;
              comp[nni] = n;
              q2.push([nnx, nny]);
            }
          }
          sizes.push(sz);
          n++;
        }
      }
      return { comp: comp, sizes: sizes, count: n };
    }
    // Cost of routing the strait through a tile, as an integer: cheap through
    // existing water, cheaper through low shore-side land (natural valleys),
    // wobbly via noise, and pricey right at the map rim so channels dive
    // inland instead of paving a straight wall along the border.
    function crossCost(tx, ty) {
      var i6 = idx(tx, ty);
      var b6 = biome[i6];
      if (b6 === OCEAN || b6 === WATER) return 400;
      var c6 = 1000 + Math.round(Math.max(0, elev[i6] - WATER_LEVEL) * 9000);
      c6 += Math.round(hash2(tx, ty, seed + 803) * 2000);
      var ed = tx < ty ? tx : ty;
      var ed2 = (W - 1 - tx) < (H - 1 - ty) ? (W - 1 - tx) : (H - 1 - ty);
      if (ed2 < ed) ed = ed2;
      if (ed < 6) c6 += (6 - ed) * 1500;
      return c6;
    }
    for (var iter = 0; iter < 10; iter++) {
      var L = labelComps();
      if (L.count <= 1) break;
      var main = 0;
      for (var ci = 1; ci < L.count; ci++) if (L.sizes[ci] > L.sizes[main]) main = ci;
      var target = -1;
      for (var cj = 0; cj < L.count; cj++) {
        if (cj === main) continue;
        if (target === -1 || L.sizes[cj] > L.sizes[target]) target = cj;
      }
      // Dijkstra from every main-ocean tile to the nearest target tile
      // (settled set: each tile routes once, so this always finishes fast)
      var dist = new Float64Array(W * H).fill(Infinity);
      var prev = new Int32Array(W * H).fill(-1);
      var settled = new Uint8Array(W * H);
      var heapN = [], heapD = [];
      function hLess(d1, n1, d2, n2) { return d1 < d2 || (d1 === d2 && n1 < n2); }
      function hPush(nd, nn) {
        heapD.push(nd); heapN.push(nn);
        var i = heapD.length - 1;
        while (i > 0) {
          var pp = (i - 1) >> 1;
          if (hLess(heapD[i], heapN[i], heapD[pp], heapN[pp])) {
            var td = heapD[i]; heapD[i] = heapD[pp]; heapD[pp] = td;
            var tn = heapN[i]; heapN[i] = heapN[pp]; heapN[pp] = tn;
            i = pp;
          } else break;
        }
      }
      function hPop() {
        var top = heapN[0];
        var lastD = heapD.pop(), lastN = heapN.pop();
        if (heapD.length) {
          heapD[0] = lastD; heapN[0] = lastN;
          var i = 0;
          for (;;) {
            var l = i * 2 + 1, r = l + 1, m = i;
            if (l < heapD.length && hLess(heapD[l], heapN[l], heapD[m], heapN[m])) m = l;
            if (r < heapD.length && hLess(heapD[r], heapN[r], heapD[m], heapN[m])) m = r;
            if (m === i) break;
            var td = heapD[i]; heapD[i] = heapD[m]; heapD[m] = td;
            var tn = heapN[i]; heapN[i] = heapN[m]; heapN[m] = tn;
            i = m;
          }
        }
        return top;
      }
      for (var bi = 0; bi < W * H; bi++) {
        if (L.comp[bi] === main) { dist[bi] = 0; prev[bi] = bi; hPush(0, bi); }
      }
      var found = -1;
      while (heapD.length) {
        var cur = hPop();
        if (settled[cur]) continue;
        settled[cur] = 1;
        if (L.comp[cur] === target) { found = cur; break; }
        var cx0 = cur % W, cy0 = (cur / W) | 0;
        var cd = dist[cur];
        var nbs = [[cx0 + 1, cy0], [cx0 - 1, cy0], [cx0, cy0 + 1], [cx0, cy0 - 1]];
        for (var dd0 = 0; dd0 < 4; dd0++) {
          var ax = nbs[dd0][0], ay = nbs[dd0][1];
          if (!inBounds(ax, ay)) continue;
          var ai = idx(ax, ay);
          if (settled[ai]) continue;
          var nd = cd + crossCost(ax, ay);
          if (nd < dist[ai]) { dist[ai] = nd; prev[ai] = cur; hPush(nd, ai); }
        }
      }
      if (found === -1) break;
      // Collect the route, then carve it with a varying width and wobbly
      // banks. The center line is always carved so the strait stays joined.
      var path = [];
      var pp0 = found, pg = 0;
      while (pp0 !== -1 && pg++ < W * H) {
        path.push(pp0);
        if (L.comp[pp0] === main) break;
        pp0 = prev[pp0];
      }
      for (var s = 0; s < path.length; s++) {
        var p = path[s];
        var pxx = p % W, pyy = (p / W) | 0;
        var wide = hash2(pxx, pyy, seed + 804) < 0.35;
        var cells = [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]];
        // Wide bulges reach two tiles out, but only over a bridge tile that
        // is ocean (just carved or already) — never strand a lone speck.
        if (wide) cells.push([2, 0, 1, 0], [-2, 0, -1, 0], [0, 2, 0, 1], [0, -2, 0, -1]);
        for (var c3 = 0; c3 < cells.length; c3++) {

function shade(base, amt) {
  return 'rgb(' + Math.max(0, Math.min(255, base[0] + amt)) + ',' +
         Math.max(0, Math.min(255, base[1] + amt)) + ',' +
         Math.max(0, Math.min(255, base[2] + amt)) + ')';
}
var C_OCEAN = [22, 68, 150], C_WATER = [52, 152, 219], C_LAKE = [32, 110, 185],

function drawTree(sx, sy, tx, ty, leafAlpha, trunkAlpha) {
  // Top-down canopy seen from directly above: leaves only.
  // Trunk is just a circle in the middle, shown only when under the tree.
  // Every tree gets its own size (1x - 1.35x) and slight look.
  var sc = treeScale(tx, ty);

  var dark = pal === 2 ? '#0f4d2e' : (pal === 1 ? '#174d1f' : '#14521f');
  var mid = pal === 2 ? '#1b7a3d' : (pal === 1 ? '#237a35' : '#1e6b2e');

  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.ellipse(sx + 4 * sc, sy + 7 * sc, 19 * sc, 8 * sc, 0, 0, 7); ctx.fill();
  ctx.globalAlpha = leafAlpha;
  blob(-11 + j(51), -2 + j(52), 13, dark);
  blob(11 + j(53), -2 + j(54), 13, dark);
  blob(j(55), -12 + j(56), 14, dark);
  blob(j(57), 9 + j(58), 13, dark);
  blob(-7 + j(59), -5 + j(60), 10, mid);
  blob(8 + j(61), -6 + j(62), 10, mid);
  blob(j(63), 3 + j(64), 10, mid);
  blob(-4 + j(65), -9 + j(66), 5, light);
  blob(6 + j(67), 1 + j(68), 4, light);

  if (trunkAlpha > 0.01) {
    ctx.globalAlpha = trunkAlpha;
    ctx.fillStyle = '#8a5a33';
    ctx.strokeStyle = '#5d3a1a';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(sx, sy, 6 * sc, 0, 7); ctx.fill(); ctx.stroke();

      var pk = idx(px2, py2);
      if (!palms[pk]) continue;
      var psc = palmScale(px2, py2);
      var pccx = px2 * TILE + TILE / 2, pccy = py2 * TILE + TILE / 2;
      var ppdx = player.x - pccx, ppdy = player.y - pccy;
      var punder = (ppdx * ppdx + ppdy * ppdy) < (24 * psc + 6) * (24 * psc + 6);
      var ptarget = punder ? 0.45 : 1;
      palmA[pk] += (ptarget - palmA[pk]) * Math.min(1, rdt * 10);
      var ptrunkTarget = punder ? 1 : 0;
      palmTrunkA[pk] += (ptrunkTarget - palmTrunkA[pk]) * Math.min(1, rdt * 10);
      drawPalm(pccx, pccy, px2, py2, palmA[pk], palmTrunkA[pk]);
    }
  }

  // Acacia umbrellas the same way: above the player, fading when underneath.
  for (var ay2 = oy0; ay2 <= oy1; ay2++) {
    for (var ax2 = ox0; ax2 <= ox1; ax2++) {
      var ak = idx(ax2, ay2);
      if (!acacias[ak]) continue;
      var asc2 = acaciaScale(ax2, ay2);
      var accx = ax2 * TILE + TILE / 2, accy = ay2 * TILE + TILE / 2;
      var apdx = player.x - accx, apdy = player.y - accy;
      var aunder = (apdx * apdx + apdy * apdy) < (30 * asc2 + 6) * (30 * asc2 + 6);
      var atarget = aunder ? 0.45 : 1;
      acaciaA[ak] += (atarget - acaciaA[ak]) * Math.min(1, rdt * 10);
      var acaciaTrunkTarget = aunder ? 1 : 0;
      acaciaTrunkA[ak] += (acaciaTrunkTarget - acaciaTrunkA[ak]) * Math.min(1, rdt * 10);
      drawAcacia(accx, accy, ax2, ay2, acaciaA[ak], acaciaTrunkA[ak]);
    }
  }

  // Cacti stand stiff above the player; prickly, so no fading and no hiding.
  for (var cy2 = oy0; cy2 <= oy1; cy2++) {
    for (var cx2 = ox0; cx2 <= ox1; cx2++) {
      var ck = idx(cx2, cy2);
      if (!cactus[ck]) continue;
      drawCactus(cx2 * TILE + TILE / 2, cy2 * TILE + TILE / 2, cx2, cy2);
    }
  }

  // Dead trees stand bare above the player; they never fade or hide you.
  for (var dy2 = oy0; dy2 <= oy1; dy2++) {
    for (var dx2 = ox0; dx2 <= ox1; dx2++) {
      var dk3 = idx(dx2, dy2);
      if (!deadTree[dk3]) continue;
      drawDeadTree(dx2 * TILE + TILE / 2, dy2 * TILE + TILE / 2, dx2, dy2);
    }
  }

  // Boulders squat above the player too; solid stone, no fading or hiding.
  for (var boy2 = oy0; boy2 <= oy1; boy2++) {
    for (var box2 = ox0; box2 <= ox1; box2++) {
      var bok = idx(box2, boy2);
      if (!boulder[bok]) continue;
      drawBoulder(box2 * TILE + TILE / 2, boy2 * TILE + TILE / 2, box2, boy2);
    }
  }

  // Vultures are above it all: flying birds soar over canopies and cacti,
  // and perched birds sit on top of their cacti. Drawn last of all.
  for (var vli2 = 0; vli2 < vultures.length; vli2++) {
    var vu2 = vultures[vli2];
    var vmg = vu2.state === 'perch' ? 60 : 100;
    if (vu2.x < cam.x - vmg || vu2.x > cam.x + viewW + vmg || vu2.y < cam.y - vmg || vu2.y > cam.y + viewH + vmg) continue;
    drawVulture(vu2);
  }
  // Snowy owls fly over everything too, above the pines they perch on.
  // Snatched rabbits dangle above the trees with their owls (owl drawn
  // over the catch it holds).
  for (var bci = 0; bci < bunnies.length; bci++) {
    var bc = bunnies[bci];
    if (bc.state !== 'caught') continue;
    if (bc.x < cam.x - 60 || bc.x > cam.x + viewW + 60 || bc.y < cam.y - 60 || bc.y > cam.y + viewH + 60) continue;
    drawBunny(bc, t);
  }
  for (var owi3 = 0; owi3 < snowyOwls.length; owi3++) {
    var ow2 = snowyOwls[owi3];
    var omg = (ow2.state === 'perch' || ow2.state === 'eat') ? 60 : 100;
    if (ow2.x < cam.x - omg || ow2.x > cam.x + viewW + omg || ow2.y < cam.y - omg || ow2.y > cam.y + viewH + omg) continue;
    drawSnowyOwl(ow2);
  }
  // Hawks soar over everything too, perched on tree tops to eat.
  for (var hki3 = 0; hki3 < hawks.length; hki3++) {
    var hk2 = hawks[hki3];
    var hmg = (hk2.state === 'perch' || hk2.state === 'eat') ? 60 : 100;
    if (hk2.x < cam.x - hmg || hk2.x > cam.x + viewW + hmg || hk2.y < cam.y - hmg || hk2.y > cam.y + viewH + hmg) continue;
    drawHawk(hk2);
  }
  // Seagulls soar over everything too, high above the waves.
  for (var gui2 = 0; gui2 < seagulls.length; gui2++) {
    var gu2 = seagulls[gui2];
    if (gu2.held) continue; // snatched by an eagle: drawn in its beak instead
    if (gu2.x < cam.x - 100 || gu2.x > cam.x + viewW + 100 || gu2.y < cam.y - 100 || gu2.y > cam.y + viewH + 100) continue;
    drawSeagull(gu2);
  }
  // Breaching dolphins fly above the waves too, full-color mid-jump.
  for (var dli3 = 0; dli3 < dolphins.length; dli3++) {
    var dl3 = dolphins[dli3];
    if (dl3.state !== 'jump') continue;
    if (dl3.x < cam.x - 100 || dl3.x > cam.x + viewW + 100 || dl3.y < cam.y - 100 || dl3.y > cam.y + viewH + 100) continue;
    drawDolphin(dl3);
  }
  // Carried catches dangle above everything with their eagles (drawn first
  // so the eagle overlaps what it holds)
  for (var eci = 0; eci < eagles.length; eci++) {
    var ego = eagles[eci];
    if ((ego.state !== 'carry' && ego.state !== 'eat') || !ego.prey || ego.preyKind === 'fish') continue;
    var epx = ego.prey.x, epy = ego.prey.y;
    if (epx < cam.x - 100 || epx > cam.x + viewW + 100 || epy < cam.y - 100 || epy > cam.y + viewH + 100) continue;
    if (ego.preyKind === 'bunny') drawBunny(ego.prey, t);
    else if (ego.preyKind === 'hedge') drawHedgehog(ego.prey, t);
    else if (ego.preyKind === 'tar') drawTarantula(ego.prey, t);
    else if (ego.preyKind === 'lizard') drawLizard(ego.prey, t);
    else if (ego.preyKind === 'jack') drawJackrabbit(ego.prey, t);
    else if (ego.preyKind === 'frog') drawFrog(ego.prey, t);
    else if (ego.preyKind === 'dillo') drawArmadillo(ego.prey, t);
    else if (ego.preyKind === 'gull') drawSeagull(ego.prey);
    else if (ego.preyKind === 'duck') drawDuck(ego.prey);
  }
  // Grabbed jackrabbits dangle above everything with whoever holds them
  // (eagle beaks and snake jaws alike)
  for (var jki3 = 0; jki3 < jacks.length; jki3++) {
    var jk3 = jacks[jki3];
    if (jk3.state !== 'caught') continue;
    if (jk3.x < cam.x - 100 || jk3.x > cam.x + viewW + 100 || jk3.y < cam.y - 100 || jk3.y > cam.y + viewH + 100) continue;
    drawJackrabbit(jk3, t);
  }
  // Grabbed snakes shake above everything with whoever holds them
  // (eagle beaks and the secretary alike)
  for (var sci = 0; sci < snakes.length; sci++) {
    var sc2 = snakes[sci];
    if (sc2.state !== 'caught') continue;
    if (sc2.x < cam.x - 100 || sc2.x > cam.x + viewW + 100 || sc2.y < cam.y - 100 || sc2.y > cam.y + viewH + 100) continue;
    drawSnake(sc2, t);
  }
  // Eagles soar over everything, perched on treetops to eat.
  for (var egi2 = 0; egi2 < eagles.length; egi2++) {
    var eg2 = eagles[egi2];
    if (eg2.x < cam.x - 100 || eg2.x > cam.x + viewW + 100 || eg2.y < cam.y - 100 || eg2.y > cam.y + viewH + 100) continue;
    drawEagle(eg2);
  }
  // The volcano dragon looms over everything below it.
  if (dragon) {
    var dg2 = dragon;
    if (!(dg2.x < cam.x - 200 || dg2.x > cam.x + viewW + 200 || dg2.y < cam.y - 200 || dg2.y > cam.y + viewH + 200)) {
      drawDragon(dg2);
    }
  }

  // Screen-space UI (joystick, minimap)
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Touch joystick visual
  if (joy.active) {
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(joy.bx, joy.by, 55, 0, 7); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath(); ctx.arc(joy.bx + joy.dx * 55, joy.by + joy.dy * 55, 22, 0, 7); ctx.fill();
  }

  // Minimap
  var mm = 150, mx = vw - mm - 12, my = 12;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(mx - 5, my - 5, mm + 10, mm + 10);
  ctx.drawImage(mapCanvas, mx, my, mm, mm);
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 2;
  ctx.strokeRect(mx - 5, my - 5, mm + 10, mm + 10);
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(mx + (player.x / WORLD_PX) * mm, my + (player.y / WORLD_PY) * mm, 3.5, 0, 7);
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1;
  ctx.stroke();
  // an orange dot tracking each eagle
  for (var egi3 = 0; egi3 < eagles.length; egi3++) {
    var eg3 = eagles[egi3];
    ctx.fillStyle = '#ff9d00';
    ctx.beginPath();
    ctx.arc(mx + (eg3.x / WORLD_PX) * mm, my + (eg3.y / WORLD_PY) * mm, 2.5, 0, 7);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

// ---------- Main loop ----------
var last = performance.now();
function loop(now) {
  var dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render(now, dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
