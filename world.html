<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Open World</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b1020;
    font-family: 'Segoe UI', sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #hud {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 10;
    background: rgba(13, 19, 27, 0.93);
    color: #fff;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 0.9rem;
    line-height: 1.5;
    pointer-events: none;
  }
  #hud .title { font-weight: bold; color: #ffd700; font-size: 1rem; }
  #hidden-badge {
    display: none;
    position: fixed;
    top: 184px;
    left: 12px;
    z-index: 10;
    background: rgba(13, 19, 27, 0.93);
    color: #fff;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 0.9rem;
    pointer-events: none;
  }
  #help {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    background: rgba(13, 19, 27, 0.93);
    color: #fff;
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 0.85rem;
    white-space: nowrap;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="title">🌍 Open World</div>
  <div id="coords">x: 0, y: 0</div>
  <div id="berries">🫐 Berries: 0</div>
  <div id="shrooms">🍄 Mushrooms: 0</div>
</div>
<div id="hidden-badge">🤫 Hidden!</div>
<div id="help">WASD / Arrows to walk &nbsp;•&nbsp; Shift to run &nbsp;•&nbsp; Touch: drag to walk</div>
<script>
'use strict';
// ---------- Config ----------
var TILE = 32;
var ZOOM = 1.6; // zoomed-in camera (map layout unchanged)
var W = 240, H = 240;               // decently big, but NOT infinite
var WORLD_PX = W * TILE, WORLD_PY = H * TILE;
var WATER_LEVEL = 0.30;
var SAND_LINE = 0.345;

// Biome ids
var OCEAN = 0, WATER = 1, SAND = 2, GRASS = 3;

// ---------- Deterministic hashing / RNG ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(x, y, s) {
  var h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967295;
}

// ---------- Value noise ----------
var lat = new Float32Array(256);
var perm = new Uint8Array(512);
function seedNoise(rand) {
  var p = [];
  for (var i = 0; i < 256; i++) { p[i] = i; lat[i] = rand(); }
  for (var j = 255; j > 0; j--) {
    var k = (rand() * (j + 1)) | 0;
    var tmp = p[j]; p[j] = p[k]; p[k] = tmp;
  }
  for (var m = 0; m < 512; m++) perm[m] = p[m & 255];
}
function vnoise(x, y) {
  var xi = Math.floor(x), yi = Math.floor(y);
  var xf = x - xi, yf = y - yi;
  var X = xi & 255, Y = yi & 255;
  var v00 = lat[perm[(perm[X] + Y) & 511] & 255];
  var v10 = lat[perm[(perm[(X + 1) & 255] + Y) & 511] & 255];
  var v01 = lat[perm[(perm[X] + Y + 1) & 511] & 255];
  var v11 = lat[perm[(perm[(X + 1) & 255] + Y + 1) & 511] & 255];
  var u = xf * xf * (3 - 2 * xf);
  var v = yf * yf * (3 - 2 * yf);
  return (v00 * (1 - u) + v10 * u) * (1 - v) + (v01 * (1 - u) + v11 * u) * v;
}
function fbm(x, y, oct) {
  var sum = 0, amp = 0.5, f = 1, norm = 0;
  for (var i = 0; i < oct; i++) {
    sum += amp * vnoise(x * f, y * f);
    norm += amp;
    amp *= 0.5;
    f *= 2.03;
  }
  return sum / norm;
}

// ---------- World data ----------
var elev = new Float32Array(W * H);
var biome = new Uint8Array(W * H);   // OCEAN/WATER/SAND/GRASS
var bigLake = new Uint8Array(W * H); // 1 on big-lake water (mid-tone color)
var trees = new Uint8Array(W * H);
var pines = new Uint8Array(W * H); // snowy pine trees in the top-left snow area
var snow = new Uint8Array(W * H); // 1 on snowy land (top-left, grass only)
var ice = new Uint8Array(W * H); // 1 on frozen pond water near the snow
var palms = new Uint8Array(W * H); // coconut palms on ocean beaches + islands
var bushes = new Uint8Array(W * H);
var solid = new Uint8Array(W * H);
var berryN = new Uint8Array(W * H);   // berries currently on a bush (0-3)
var berryT = new Float32Array(W * H); // regrow timer per bush
var litter = new Uint8Array(W * H); // forest floor: 0 none, 1 leaf, 2 leaf, 3 stick
var stumps = new Uint8Array(W * H); // rare old stumps
var shells = new Uint8Array(W * H); // shells on ocean beaches: 0 none, 1 pink, 2 white, 3 purple
var crabHoles = []; // beach crab holes: {x,y,state,timer,cx,cy,tx,ty,pause,heading}
var fishes = []; // pond + ocean fish: {x,y,heading,speed,turn,sea}
var ducks = []; // pond ducks: {x,y,heading,speed,turn,state,timer,tx,ty,lwX,lwY,sc,body,head,drake,wake,age,lifespan,nester,nest,layT,deathT,fade,chick,gsc,nx,ny,phase,carry}
var nests = []; // duck nests on shores: {x,y,eggs:[age],clutch,age,mom}
var duckSpots = []; // open pond-water tiles where newcomer ducks paddle in
var DUCK_TONES = [ [ '#8a6f4d', '#6e5739' ], [ '#9aa0a6', '#7c8288' ], [ '#6b5b45', '#52452f' ] ]; // body + head shades
var splashes = []; // wading ripples: {x,y,age,life,maxR}
var noBush = new Uint8Array(W * H); // keep bushes clear of logs/stumps
var open = new Uint8Array(W * H); // open field: grass with no trees nearby
var mushN = new Uint8Array(W * H); // mushrooms on a stump (0-3)
var mushT = new Float32Array(W * H); // mushroom regrow timer
var mushScore = 0;
var seed = 20260906;
var score = 0, eatCd = 0, splashT = 0, duckCheckT = 0;
var playerA = 1, wasHiding = false;
var iceVx = 0, iceVy = 0; // skating momentum while sliding on ice
var treeA = new Float32Array(W * H).fill(1); // canopy fade per tree
var pineA = new Float32Array(W * H).fill(1); // canopy fade per pine
var pineTrunkA = new Float32Array(W * H); // trunk shows only when under the pine
var palmA = new Float32Array(W * H).fill(1); // frond fade per palm
var palmTrunkA = new Float32Array(W * H); // trunk ring shows only when under the palm
var trunkA = new Float32Array(W * H); // trunk shows only when under the tree
var bushA = new Float32Array(W * H).fill(1); // bush fade when inside one

function idx(x, y) { return y * W + x; }
function inBounds(x, y) { return x >= 0 && y >= 0 && x < W && y < H; }

function generate(s) {
  seed = s;
  var rand = mulberry32(seed);
  seedNoise(rand);
  var x, y;

  // Elevation with island falloff (ocean at the edges)
  for (y = 0; y < H; y++) {
    for (x = 0; x < W; x++) {
      var base = fbm(x * 0.014, y * 0.014, 4);
      base += 0.15 * fbm(x * 0.06 + 40, y * 0.06 + 40, 2);
      var dx = (x - W / 2) / (W / 2);
      var dy = (y - H / 2) / (H / 2);
      var d = Math.sqrt(dx * dx + dy * dy) / Math.SQRT2;
      var elevV = base + 0.06 - Math.pow(d, 2.1) * 0.72;
      // Northern sea: dip the far north below the waves so the island sits
      // off the top frame. Its reach varies along x, so the new coast is a
      // curvy shoreline with bays and points instead of a straight cut.
      var northR = 26 + 30 * fbm(x * 0.02 + 7.3, 3.1, 3);
      if (y < northR) {
        var nt = 1 - y / northR;
        elevV -= 0.34 * nt * nt;
      }
      elev[idx(x, y)] = elevV;
    }
  }

  // Base water vs land
  for (var i = 0; i < W * H; i++) {
    biome[i] = elev[i] < WATER_LEVEL ? WATER : GRASS;
  }

  // (No rivers — lakes and ocean only)

  // Ocean = water connected to the map border (flood fill); inland water stays lakes
  var stack = [];
  for (x = 0; x < W; x++) { stack.push([x, 0]); stack.push([x, H - 1]); }
  for (y = 0; y < H; y++) { stack.push([0, y]); stack.push([W - 1, y]); }
  while (stack.length) {
    var c = stack.pop();
    var qx2 = c[0], qy2 = c[1];
    if (!inBounds(qx2, qy2)) continue;
    var ii = idx(qx2, qy2);
    if (biome[ii] !== WATER || solid[ii] === 2) continue;
    biome[ii] = OCEAN;
    solid[ii] = 2; // visited marker reused below
    stack.push([qx2 + 1, qy2]); stack.push([qx2 - 1, qy2]);
    stack.push([qx2, qy2 + 1]); stack.push([qx2, qy2 - 1]);
  }

  // Connect all ocean parts so the ocean is a single connected body.
  // Land bridges to the edge can split border water into separate OCEAN
  // patches — carve a winding, valley-following strait between them so the
  // new shoreline looks like a drowned river valley, not a straight canal.
  (function connectOceans() {
    function labelComps() {
      var comp = new Int32Array(W * H).fill(-1);
      var sizes = [];
      var n = 0;
      var d4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      for (var ly = 0; ly < H; ly++) {
        for (var lx = 0; lx < W; lx++) {
          var li0 = idx(lx, ly);
          if (biome[li0] !== OCEAN || comp[li0] !== -1) continue;
          var q2 = [[lx, ly]];
          comp[li0] = n;
          var sz = 0;
          while (q2.length) {
            var cc = q2.pop();
            sz++;
            for (var k = 0; k < 4; k++) {
              var nnx = cc[0] + d4[k][0], nny = cc[1] + d4[k][1];
              if (!inBounds(nnx, nny)) continue;
              var nni = idx(nnx, nny);
              if (biome[nni] !== OCEAN || comp[nni] !== -1) continue;
              comp[nni] = n;
              q2.push([nnx, nny]);
            }
          }
          sizes.push(sz);
          n++;
        }
      }
      return { comp: comp, sizes: sizes, count: n };
    }
    // Cost of routing the strait through a tile, as an integer: cheap through
    // existing water, cheaper through low shore-side land (natural valleys),
    // wobbly via noise, and pricey right at the map rim so channels dive
    // inland instead of paving a straight wall along the border.
    function crossCost(tx, ty) {
      var i6 = idx(tx, ty);
      var b6 = biome[i6];
      if (b6 === OCEAN || b6 === WATER) return 400;
      var c6 = 1000 + Math.round(Math.max(0, elev[i6] - WATER_LEVEL) * 9000);
      c6 += Math.round(hash2(tx, ty, seed + 803) * 2000);
      var ed = tx < ty ? tx : ty;
      var ed2 = (W - 1 - tx) < (H - 1 - ty) ? (W - 1 - tx) : (H - 1 - ty);
      if (ed2 < ed) ed = ed2;
      if (ed < 6) c6 += (6 - ed) * 1500;
      return c6;
    }
    for (var iter = 0; iter < 10; iter++) {
      var L = labelComps();
      if (L.count <= 1) break;
      var main = 0;
      for (var ci = 1; ci < L.count; ci++) if (L.sizes[ci] > L.sizes[main]) main = ci;
      var target = -1;
      for (var cj = 0; cj < L.count; cj++) {
        if (cj === main) continue;
        if (target === -1 || L.sizes[cj] > L.sizes[target]) target = cj;
      }
      // Dijkstra from every main-ocean tile to the nearest target tile
      // (settled set: each tile routes once, so this always finishes fast)
      var dist = new Float64Array(W * H).fill(Infinity);
      var prev = new Int32Array(W * H).fill(-1);
      var settled = new Uint8Array(W * H);
      var heapN = [], heapD = [];
      function hLess(d1, n1, d2, n2) { return d1 < d2 || (d1 === d2 && n1 < n2); }
      function hPush(nd, nn) {
        heapD.push(nd); heapN.push(nn);
        var i = heapD.length - 1;
        while (i > 0) {
          var pp = (i - 1) >> 1;
          if (hLess(heapD[i], heapN[i], heapD[pp], heapN[pp])) {
            var td = heapD[i]; heapD[i] = heapD[pp]; heapD[pp] = td;
            var tn = heapN[i]; heapN[i] = heapN[pp]; heapN[pp] = tn;
            i = pp;
          } else break;
        }
      }
      function hPop() {
        var top = heapN[0];
        var lastD = heapD.pop(), lastN = heapN.pop();
        if (heapD.length) {
          heapD[0] = lastD; heapN[0] = lastN;
          var i = 0;
          for (;;) {
            var l = i * 2 + 1, r = l + 1, m = i;
            if (l < heapD.length && hLess(heapD[l], heapN[l], heapD[m], heapN[m])) m = l;
            if (r < heapD.length && hLess(heapD[r], heapN[r], heapD[m], heapN[m])) m = r;
            if (m === i) break;
            var td = heapD[i]; heapD[i] = heapD[m]; heapD[m] = td;
            var tn = heapN[i]; heapN[i] = heapN[m]; heapN[m] = tn;
            i = m;
          }
        }
        return top;
      }
      for (var bi = 0; bi < W * H; bi++) {
        if (L.comp[bi] === main) { dist[bi] = 0; prev[bi] = bi; hPush(0, bi); }
      }
      var found = -1;
      while (heapD.length) {
        var cur = hPop();
        if (settled[cur]) continue;
        settled[cur] = 1;
        if (L.comp[cur] === target) { found = cur; break; }
        var cx0 = cur % W, cy0 = (cur / W) | 0;
        var cd = dist[cur];
        var nbs = [[cx0 + 1, cy0], [cx0 - 1, cy0], [cx0, cy0 + 1], [cx0, cy0 - 1]];
        for (var dd0 = 0; dd0 < 4; dd0++) {
          var ax = nbs[dd0][0], ay = nbs[dd0][1];
          if (!inBounds(ax, ay)) continue;
          var ai = idx(ax, ay);
          if (settled[ai]) continue;
          var nd = cd + crossCost(ax, ay);
          if (nd < dist[ai]) { dist[ai] = nd; prev[ai] = cur; hPush(nd, ai); }
        }
      }
      if (found === -1) break;
      // Collect the route, then carve it with a varying width and wobbly
      // banks. The center line is always carved so the strait stays joined.
      var path = [];
      var pp0 = found, pg = 0;
      while (pp0 !== -1 && pg++ < W * H) {
        path.push(pp0);
        if (L.comp[pp0] === main) break;
        pp0 = prev[pp0];
      }
      for (var s = 0; s < path.length; s++) {
        var p = path[s];
        var pxx = p % W, pyy = (p / W) | 0;
        var wide = hash2(pxx, pyy, seed + 804) < 0.35;
        var cells = [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]];
        // Wide bulges reach two tiles out, but only over a bridge tile that
        // is ocean (just carved or already) — never strand a lone speck.
        if (wide) cells.push([2, 0, 1, 0], [-2, 0, -1, 0], [0, 2, 0, 1], [0, -2, 0, -1]);
        for (var c3 = 0; c3 < cells.length; c3++) {
          var ox = cells[c3][0], oy = cells[c3][1];
          var center = (ox === 0 && oy === 0);
          var ex = pxx + ox, ey = pyy + oy;
          if (!inBounds(ex, ey)) continue;
          if (cells[c3].length > 2) {
            var bx = pxx + cells[c3][2], by = pyy + cells[c3][3];
            if (!inBounds(bx, by) || biome[idx(bx, by)] !== OCEAN) continue;
          }
          if (!center) {
            var far = (Math.abs(ox) === 2 || Math.abs(oy) === 2);
            if (hash2(ex, ey, seed + 801) < (far ? 0.5 : 0.3)) continue;
          }
          var ei = idx(ex, ey);
          if (biome[ei] !== OCEAN) {
            biome[ei] = OCEAN;
            elev[ei] = WATER_LEVEL - 0.05 - hash2(ex, ey, seed + 802) * 0.05;
          }
        }
      }
    }
    // Any lakes now touching the (single) ocean become part of it
    var ab = [];
    for (var abi = 0; abi < W * H; abi++) if (biome[abi] === OCEAN) ab.push(abi);
    while (ab.length) {
      var ci2 = ab.pop();
      var gx0 = ci2 % W, gy0 = (ci2 / W) | 0;
      var dd = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      for (var qd = 0; qd < 4; qd++) {
        var hx = gx0 + dd[qd][0], hy = gy0 + dd[qd][1];
        if (!inBounds(hx, hy)) continue;
        var hi = idx(hx, hy);
        if (biome[hi] === WATER) { biome[hi] = OCEAN; ab.push(hi); }
      }
    }
  })();

  // Remove tiny odd ponds (keep real lakes and ocean)
  var seen = new Uint8Array(W * H);
  for (y = 0; y < H; y++) {
    for (x = 0; x < W; x++) {
      var li = idx(x, y);
      if (biome[li] !== WATER || seen[li]) continue;
      var region = [];
      var q = [[x, y]];
      seen[li] = 1;
      while (q.length) {
        var c = q.pop();
        region.push(c);
        var dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
        for (var di = 0; di < 4; di++) {
          var nx = c[0] + dirs[di][0], ny = c[1] + dirs[di][1];
          if (!inBounds(nx, ny)) continue;
          var ni = idx(nx, ny);
          if (biome[ni] !== WATER || seen[ni]) continue;
          seen[ni] = 1;
          q.push([nx, ny]);
        }
      }
      if (region.length < 25) {
        for (var ri = 0; ri < region.length; ri++) {
          var gi = idx(region[ri][0], region[ri][1]);
          biome[gi] = GRASS; // fill tiny odd ponds with grass, not sand
        }
      }
    }
  }

  // Ponds: scatter small inland ponds (grass runs straight to the water)
  var pondsWanted = 14, pondTries = 0;
  while (pondsWanted > 0 && pondTries < 400) {
    pondTries++;
    var ppx = 25 + ((rand() * (W - 50)) | 0);
    var ppy = 25 + ((rand() * (H - 50)) | 0);
    var ppi = idx(ppx, ppy);
    if (biome[ppi] !== GRASS) continue;
    var pdcx = ppx - (W >> 1), pdcy = ppy - (H >> 1);
    if (pdcx * pdcx + pdcy * pdcy < 100) continue; // keep spawn clearing open
    // keep ponds well clear of the ocean (sand is drawn later near ocean,
    // so this keeps ponds off sand too)
    var pdClear = true;
    for (var pcy = ppy - 12; pcy <= ppy + 12 && pdClear; pcy++) {
      for (var pcx = ppx - 12; pcx <= ppx + 12; pcx++) {
        if (!inBounds(pcx, pcy)) continue;
        if (biome[idx(pcx, pcy)] === OCEAN) { pdClear = false; break; }
      }
    }
    if (!pdClear) continue;
    var pdr = 2 + rand() * 2.5; // 2 - 4.5 tile radius with a wobbly edge
    for (var pdy = Math.floor(ppy - pdr - 1); pdy <= Math.ceil(ppy + pdr + 1); pdy++) {
      for (var pdx = Math.floor(ppx - pdr - 1); pdx <= Math.ceil(ppx + pdr + 1); pdx++) {
        if (!inBounds(pdx, pdy)) continue;
        var pdpi = idx(pdx, pdy);
        if (biome[pdpi] !== GRASS) continue;
        var pddx = pdx - ppx, pddy = pdy - ppy;
        var pdd = Math.sqrt(pddx * pddx + pddy * pddy);
        var pdfuzz = (hash2(pdx, pdy, seed + 401) - 0.5) * 1.6;
        if (pdd < pdr + pdfuzz) {
          biome[pdpi] = WATER;
          elev[pdpi] = WATER_LEVEL - 0.05 - hash2(pdx, pdy, seed + 402) * 0.05;
        }
      }
    }
    pondsWanted--;
  }

  // Big lake at the requested spot (ponds may merge into it)
  var blx = 130, bly = 200, blr = 13;
  bigLake.fill(0);
  for (var blyy = Math.floor(bly - blr - 2); blyy <= Math.ceil(bly + blr + 2); blyy++) {
    for (var blxx = Math.floor(blx - blr - 2); blxx <= Math.ceil(blx + blr + 2); blxx++) {
      if (!inBounds(blxx, blyy)) continue;
      var blpi = idx(blxx, blyy);
      if (biome[blpi] === OCEAN) continue;
      var bldx = (blxx - blx) * 0.8, bldy = (blyy - bly) * 1.15;
      var bldd = Math.sqrt(bldx * bldx + bldy * bldy);
      var blf = 0.65 + 0.7 * fbm(blxx * 0.07 + 900, blyy * 0.07 + 900, 3);
      if (bldd < blr * blf) {
        biome[blpi] = WATER;
        bigLake[blpi] = 1;
        elev[blpi] = WATER_LEVEL - 0.05 - hash2(blxx, blyy, seed + 601) * 0.05;
      }
    }
  }

  // Ponds stay connected: a lone WATER tile touching no other WATER tile
  // (4 sides, like every other flood fill here) is filled back to grass,
  // so every pond tile touches at least one other pond tile.
  for (y = 0; y < H; y++) {
    for (x = 0; x < W; x++) {
      var lone = idx(x, y);
      if (biome[lone] !== WATER) continue;
      if ((x + 1 < W && biome[lone + 1] === WATER) ||
          (x - 1 >= 0 && biome[lone - 1] === WATER) ||
          (y + 1 < H && biome[lone + W] === WATER) ||
          (y - 1 >= 0 && biome[lone - W] === WATER)) continue;
      biome[lone] = GRASS;
      bigLake[lone] = 0;
      elev[lone] = WATER_LEVEL + 0.02;
    }
  }

  // Spawn: nearest grass to center
  var spawn = { x: W >> 1, y: H >> 1 };
  outer:
  for (var rad = 0; rad < W; rad++) {
    for (var ay = -rad; ay <= rad; ay++) {
      for (var ax = -rad; ax <= rad; ax++) {
        if (Math.max(Math.abs(ax), Math.abs(ay)) !== rad) continue;
        var gx = (W >> 1) + ax, gy = (H >> 1) + ay;

        else if (ice[i]) { r = 207; g = 227; b = 242; }

      else if (biome[i] === SAND) { r = 244; g = 226; b = 133; }
      else if (pines[i]) { r = 27; g = 94; b = 78; }
      else if (trees[i]) { r = 20; g = 90; b = 40; }

// ---------- Player ----------
var player = { x: 0, y: 0, r: 9, fx: 0, fy: 1 };

function treeScale(tx, ty) { return 1.8 + hash2(tx, ty, 41) * 0.4; } // 1.8 - 2.2x
function pineScale(tx, ty) { return 2.8 + hash2(tx, ty, 621) * 0.6; } // 2.8 - 3.4x, the giants up north
function palmScale(tx, ty) { return 1.8 + hash2(tx, ty, 301) * 0.5; } // 1.8 - 2.3x, like regular trees
function bushScale(tx, ty) {
  if (open[idx(tx, ty)]) return 1.0 + hash2(tx, ty, 83) * 0.5; // fields: 1.0 - 1.5x
  return 1.5 + hash2(tx, ty, 83) * 0.7; // forests: 1.5 - 2.2x
}
function stumpScale(tx, ty) { return 1.2 + hash2(tx, ty, 111) * 0.3; } // 1.2 - 1.5x
function mushScale(tx, ty, k) { return 0.8 + hash2(tx + k * 13, ty + k * 29, 133) * 1.0; } // 0.8x - 1.8x
function shroomPos(tx, ty, k) {
  // stump mushrooms grow in a cluster on one random side
  var cx = (tx + 0.5) * TILE, cy = (ty + 0.5) * TILE;
  var a0 = hash2(tx, ty, 137) * Math.PI * 2;
  var a = a0 + (hash2(tx + k * 7, ty + k * 11, 149) - 0.5) * 1.8;
  var rr = 11 * stumpScale(tx, ty) + 2 + hash2(tx + k * 3, ty + k * 5, 151) * 4;
  return { x: cx + Math.cos(a) * rr, y: cy + Math.sin(a) * rr };
}

function crabDart(ch) {
  for (var a = 0; a < 6; a++) {
    var ang = Math.random() * Math.PI * 2;
    var dist = 25 + Math.random() * 45;
    var nx = ch.x + Math.cos(ang) * dist, ny = ch.y + Math.sin(ang) * dist;
    var tx = Math.floor(nx / TILE), ty = Math.floor(ny / TILE);
    if (!inBounds(tx, ty)) continue;
    var b = biome[idx(tx, ty)];
    if (b === WATER || b === OCEAN) continue;
    ch.tx = nx; ch.ty = ny;
    return;
  }
  ch.tx = ch.x; ch.ty = ch.y;
}
function isInWater(px, py) {
  var tx = Math.floor(px / TILE), ty = Math.floor(py / TILE);
  if (!inBounds(tx, ty)) return true;
  var b = biome[idx(tx, ty)];
  return b === WATER || b === OCEAN;
}
function isIce(px, py) {
  var tx = Math.floor(px / TILE), ty = Math.floor(py / TILE);
  if (!inBounds(tx, ty)) return false;
  return ice[idx(tx, ty)] === 1;
}
// Walk one duck step toward (tx, ty) without entering trunk cores.
// Returns true once close enough. Heading always faces travel.
function duckStep(dk, tx, ty, sp, dt) {
  var ddx = tx - dk.x, ddy = ty - dk.y;
  var dd = Math.hypot(ddx, ddy);
  if (dd < 0.5) return true;
  var mv = Math.min(dd, sp * dt);
  var mdx = ddx / dd * mv, mdy = ddy / dd * mv;

  if (!hitsSolid(dk.x, dk.y + mdy)) dk.y += mdy;
  dk.heading = Math.atan2(ddy, ddx);
  return dd <= 5;
}
// A new adult duck paddling in to keep the population up (min 25).
// R is the random source (Math.random live, or a seeded one at build time).
function spawnDuck(x, y, R) {

// An egg hatches next to its nest: a tiny chick that grows into an adult

    x: hx, y: hy, heading: Math.random() * Math.PI * 2,

// A nesting duck claims a nest site on a free shore tile nearby. The nest
// starts as a bare hollow; the duck fetches sticks and grass
// (progress/need) before it counts as built and egg-ready.
function buildNest(dk) {
  var homeX = Math.floor(dk.x / TILE), homeY = Math.floor(dk.y / TILE);
  for (var a = 0; a < 20; a++) {
    var nx = homeX + Math.round((Math.random() - 0.5) * 4);
    var ny = homeY + Math.round((Math.random() - 0.5) * 4);
    if (!inBounds(nx, ny)) continue;
    var ni = idx(nx, ny);
    var nb = biome[ni];
    if ((nb !== GRASS && nb !== SAND) || snow[ni] || solid[ni] || bushes[ni]) continue;
    var crowded = false;
    for (var n = 0; n < nests.length; n++) {
      var enx = Math.floor(nests[n].x / TILE), eny = Math.floor(nests[n].y / TILE);
      if (Math.abs(enx - nx) <= 2 && Math.abs(eny - ny) <= 2) { crowded = true; break; }
    }
    if (crowded) continue;
    var nt = { x: (nx + 0.5) * TILE, y: (ny + 0.5) * TILE, eggs: [], clutch: 2 + ((Math.random() * 3) | 0), age: 0, mom: dk, progress: 0, need: 5 + ((Math.random() * 3) | 0), built: false };

}
// Find building material near the duck: a grass tuft, or better a fallen
// stick on grass by a tree. Sets dk.tx/ty + dk.carry color. True if found.
function pickMaterial(dk) {
  var homeX = Math.floor(dk.x / TILE), homeY = Math.floor(dk.y / TILE);
  for (var pass = 0; pass < 2; pass++) {
    for (var a = 0; a < 24; a++) {
      var nx = homeX + Math.round((Math.random() - 0.5) * 12);
      var ny = homeY + Math.round((Math.random() - 0.5) * 12);
      if (!inBounds(nx, ny)) continue;
      var ni = idx(nx, ny);
      if (biome[ni] !== GRASS || solid[ni] || bushes[ni]) continue;
      if (pass === 0) { // first pass: sticks — grass right by a tree
        var byTree = false;
        for (var oy = -1; oy <= 1 && !byTree; oy++) {

            if (!ox && !oy) continue;
            if (!inBounds(nx + ox, ny + oy)) continue;
            if (trees[idx(nx + ox, ny + oy)]) { byTree = true; break; }
          }
        }
        if (!byTree) continue;
        dk.carry = '#7a5230'; // stick
      } else {
        dk.carry = '#3fa655'; // grass tuft
      }
      dk.tx = (nx + 0.5) * TILE; dk.ty = (ny + 0.5) * TILE;

function hitsSolid(px, py) {
  var r = player.r - 3;
  if (px - r < 0 || py - r < 0 || px + r > WORLD_PX || py + r > WORLD_PY) return true;
  var x0 = Math.floor((px - r) / TILE), x1 = Math.floor((px + r) / TILE);
  var y0 = Math.floor((py - r) / TILE), y1 = Math.floor((py + r) / TILE);
  for (var ty = y0; ty <= y1; ty++) {

      if (!inBounds(tx, ty)) continue;
      var ti = idx(tx, ty);
      if (solid[ti]) {
        if (trees[ti] || stumps[ti] || palms[ti] || pines[ti]) {

          var tcx = tx * TILE + TILE / 2, tcy = ty * TILE + TILE / 2;
          var trad = trees[ti] ? 7 * treeScale(tx, ty) : (pines[ti] ? 5 * pineScale(tx, ty) : (stumps[ti] ? 7 * stumpScale(tx, ty) : 5 * palmScale(tx, ty)));

// Safety net: if the player ever ends up inside something solid
// (lag spike, edge case), push them back out to its surface.
function resolveSolids() {
  var r = player.r - 3;
  for (var iter = 0; iter < 6; iter++) {
    var best = 0, bx = 0, by = 0;
    var ptx = Math.floor(player.x / TILE), pty = Math.floor(player.y / TILE);
    for (var ty = pty - 1; ty <= pty + 1; ty++) {
      for (var tx = ptx - 1; tx <= ptx + 1; tx++) {
        if (!inBounds(tx, ty)) continue;
        var ti = idx(tx, ty);
        if (!solid[ti]) continue;
        var ox = 0, oy = 0, ov = 0;
        if (trees[ti] || stumps[ti] || palms[ti] || pines[ti]) {
          var trad = trees[ti] ? 7 * treeScale(tx, ty) : (pines[ti] ? 5 * pineScale(tx, ty) : (stumps[ti] ? 7 * stumpScale(tx, ty) : 5 * palmScale(tx, ty)));
          var cx = tx * TILE + TILE / 2, cy = ty * TILE + TILE / 2;

          var nx = Math.max(rx, Math.min(player.x, rx + TILE));
          var ny = Math.max(ry, Math.min(player.y, ry + TILE));
          var ex2 = player.x - nx, ey2 = player.y - ny;
          var ed = Math.hypot(ex2, ey2);

              else if (m2 === rr2) { ox = ov; oy = 0; }
              else if (m2 === tp) { ox = 0; oy = -ov; }

function update(dt) {

  if (keys['d'] || keys['arrowright']) dx += 1;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;

  var len = Math.hypot(dx, dy);
  if (len > 1) { dx /= len; dy /= len; }
  if (len > 0.01) { player.fx = dx / (len > 1 ? 1 : len); player.fy = dy / (len > 1 ? 1 : len); }
  var inWater = isInWater(player.x, player.y);
  var onIce = isIce(player.x, player.y);
  var wadePx = player.x, wadePy = player.y;
  if (onIce) {
    // Skating: momentum carries you, steering only nudges it. Full speed —
    // ice is the fast way across, water is the slow way.
    var want = (keys['shift'] ? 340 : 220);

    iceVy += (dy * want - iceVy) * ik;

    }

    iceVx = 0; iceVy = 0;
    var speed = (keys['shift'] ? 340 : 220) * (inWater ? 0.5 : 1) * dt;

      var nx = player.x + sx;
      if (!hitsSolid(nx, player.y)) player.x = nx;
      var ny = player.y + sy;
      if (!hitsSolid(player.x, ny)) player.y = ny;

        var nsc = pineScale(nix, niy);
        var ndx = player.x - (nix + 0.5) * TILE, ndy = player.y - (niy + 0.5) * TILE;

    for (var by = hty - 1; by <= hty + 1 && !hiding; by++) {

        if (!inBounds(bx, by) || !bushes[idx(bx, by)]) continue;
        var bsc = bushScale(bx, by);
        var bdx = player.x - (bx + 0.5) * TILE, bdy = player.y - (by + 0.5) * TILE;

function shade(base, amt) {
  return 'rgb(' + Math.max(0, Math.min(255, base[0] + amt)) + ',' +
         Math.max(0, Math.min(255, base[1] + amt)) + ',' +
         Math.max(0, Math.min(255, base[2] + amt)) + ')';

var C_OCEAN = [22, 68, 150], C_WATER = [52, 152, 219], C_LAKE = [32, 110, 185],

            ctx.moveTo(kx, ky);
            ctx.quadraticCurveTo(kx + kbd * 6, ky - kbh * 0.6, kx + kbd * 10, ky - kbh);
            ctx.stroke();
          }
          var kns = 3 + ((hash2(x, y, 214) * 2) | 0); // 3-4 stalks
          for (var kks = 0; kks < kns; kks++) {
            var kh = 26 + hash2(x + kks * 7, y + kks * 11, 216) * 18;
            var kln = (hash2(x + kks * 13, y + kks * 17, 217) - 0.5) * 24;
            var khl = 8 + hash2(x + kks * 19, y + kks * 23, 219) * 3;
            var ktx = kx + kln, kty = ky - kh;
            ctx.strokeStyle = kks % 2 ? '#2f7a3d' : '#35924a';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(kx, ky);
            ctx.quadraticCurveTo(kx + kln * 0.5, ky - kh * 0.5, ktx, kty);
            ctx.stroke();
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#6b4a2b';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(ktx, kty);
            ctx.lineTo(ktx, kty + khl);
            ctx.stroke();
            ctx.lineCap = 'butt';
            ctx.strokeStyle = '#d9c27a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(ktx, kty);
            ctx.lineTo(ktx, kty - 5);
            ctx.stroke();
          }
        }
        }
      } else if (b === SAND) {
        if (shells[i]) {
          // little scallop shell
          var shx = sx + 7 + hash2(x, y, 203) * 18, shy = sy + 9 + hash2(x, y, 204) * 14;
          var shr = hash2(x, y, 205) * Math.PI * 2;
          var shc = shells[i] === 1 ? '#f7c8d8' : (shells[i] === 2 ? '#f5f0e6' : '#d8b8e8');
          ctx.save();
          ctx.translate(shx, shy);
          ctx.rotate(shr);
          ctx.fillStyle = shc;
          ctx.strokeStyle = 'rgba(120,90,110,0.8)';
          ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(0, 0, 5, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
          ctx.strokeStyle = 'rgba(120,90,110,0.5)';
          ctx.lineWidth = 1;
          for (var sl = -1; sl <= 1; sl++) {
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(sl * 3.5, -4.5); ctx.stroke();
          }
          ctx.fillStyle = '#8a6a7a';
          ctx.beginPath(); ctx.arc(0, 1.5, 1.5, 0, 7); ctx.fill();
          ctx.restore();
        }
        if (hash2(x, y, 27) < 0.4) {
          ctx.fillStyle = 'rgba(190,170,100,0.6)';
          ctx.fillRect(sx + hash2(x, y, 28) * 26 + 2, sy + hash2(x, y, 29) * 26 + 2, 3, 3);
        }
        if (snow[i]) { // snow-dotted beach by the snowy corner
          ctx.fillStyle = 'rgba(255,255,255,0.9)';
          ctx.fillRect(sx + hash2(x, y, 646) * 25 + 2, sy + hash2(x, y, 647) * 25 + 2, 4, 4);
          ctx.fillRect(sx + hash2(x, y, 648) * 25 + 2, sy + hash2(x, y, 649) * 25 + 2, 3.5, 3.5);
          if (hash2(x, y, 650) < 0.6) {
            ctx.fillRect(sx + hash2(x, y, 659) * 25 + 2, sy + hash2(x, y, 660) * 25 + 2, 3, 3);
          }
        }
      }
    }
  }

  // Fish gliding through the water (still body, motion does the work)
  for (var dfi = 0; dfi < fishes.length; dfi++) {
    var df = fishes[dfi];
    if (df.x < cam.x - 30 || df.x > cam.x + viewW + 30 || df.y < cam.y - 30 || df.y > cam.y + viewH + 30) continue;
    ctx.save();
    ctx.translate(df.x, df.y);
    ctx.rotate(df.heading);
    ctx.fillStyle = 'rgba(10, 40, 80, 0.35)';
    ctx.beginPath(); ctx.ellipse(0, 0, 6, 2.4, 0, 0, 7); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-5, 0); ctx.lineTo(-9, -3); ctx.lineTo(-9, 3);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // Duck nests with eggs on the shores (twigs fill in as one is built)
  for (var nti2 = 0; nti2 < nests.length; nti2++) {
    var nt2 = nests[nti2];
    if (nt2.x < cam.x - 40 || nt2.x > cam.x + viewW + 40 || nt2.y < cam.y - 40 || nt2.y > cam.y + viewH + 40) continue;
    var np = nt2.built ? 1 : nt2.progress / nt2.need;
    ctx.strokeStyle = 'rgba(122,82,48,0.45)'; // bare hollow, always there
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(nt2.x, nt2.y, 11, 8, 0.3, 0, 7); ctx.stroke();
    ctx.globalAlpha = 0.25 + 0.75 * np; // gathered twigs pile up trip by trip
    ctx.strokeStyle = '#7a5230';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(nt2.x, nt2.y, 11, 8, 0.3, 0.3, Math.PI * 1.8); ctx.stroke();
    ctx.strokeStyle = '#5d3f22';
    ctx.beginPath(); ctx.ellipse(nt2.x, nt2.y, 8, 6, -0.2, Math.PI * 0.9, Math.PI * 2.6); ctx.stroke();
    ctx.strokeStyle = '#8a6a3b';
    ctx.beginPath(); ctx.ellipse(nt2.x, nt2.y, 9.5, 7, 1.2, Math.PI * 1.1, Math.PI * 2.2); ctx.stroke();
    ctx.globalAlpha = 1;
    var negoff = hash2(nt2.x | 0, nt2.y | 0, 541) * Math.PI * 2;
    for (var neg2 = 0; neg2 < nt2.eggs.length; neg2++) {
      var ega = negoff + neg2 * (Math.PI * 2 / Math.max(1, nt2.clutch));
      var egx = nt2.x + Math.cos(ega) * 4, egy = nt2.y + Math.sin(ega) * 3;
      ctx.fillStyle = '#f5ead2';
      ctx.beginPath(); ctx.ellipse(egx, egy, 3, 4, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = '#cbb98f';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(egx, egy, 3, 4, 0, 0, 7); ctx.stroke();
    }
  }

  // Ducks paddling the ponds (and the odd one waddling ashore)
  for (var dki2 = 0; dki2 < ducks.length; dki2++) {
    var dk2 = ducks[dki2];
    if (dk2.x < cam.x - 40 || dk2.x > cam.x + viewW + 40 || dk2.y < cam.y - 40 || dk2.y > cam.y + viewH + 40) continue;
    drawDuck(dk2);
  }

  // Splash ripples where you wade (expanding rings + a foam dot)
  for (var spi2 = 0; spi2 < splashes.length; spi2++) {
    var sp2 = splashes[spi2];
    if (sp2.x < cam.x - 30 || sp2.x > cam.x + viewW + 30 || sp2.y < cam.y - 30 || sp2.y > cam.y + viewH + 30) continue;
    var st2 = sp2.age / sp2.life;
    var sr = 3 + (sp2.maxR - 3) * st2;
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.55 * (1 - st2)).toFixed(3) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sp2.x, sp2.y, sr, 0, 7); ctx.stroke();
    if (st2 < 0.4) {
      ctx.fillStyle = 'rgba(255,255,255,' + (0.5 * (1 - st2 / 0.4)).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(sp2.x, sp2.y, 2.5, 0, 7); ctx.fill();
    }
  }

  // Y-sorted bushes + player (world coords; zoom transform is active)
  var px = player.x, py = player.y;
  var drewPlayer = false;
  // crab holes on the sand (crabs themselves are y-sorted below)
  for (var ho = 0; ho < crabHoles.length; ho++) {
    var hole = crabHoles[ho];
    ctx.fillStyle = 'rgba(170,140,90,0.9)';
    ctx.beginPath(); ctx.ellipse(hole.x, hole.y, 6, 4.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#3a2c1c';
    ctx.beginPath(); ctx.ellipse(hole.x, hole.y - 1, 3.5, 2.8, 0, 0, 7); ctx.fill();
  }
  var drawables = [];
  for (y = oy0; y <= oy1; y++) {
    for (x = ox0; x <= ox1; x++) {
      var j = idx(x, y);
      if (bushes[j] || stumps[j]) drawables.push([y * TILE + 12, x, y]);
    }
  }
  for (var hi2 = 0; hi2 < crabHoles.length; hi2++) {
    var hh = crabHoles[hi2];
    if (hh.state === 'hidden') continue;
    if (hh.cx < cam.x - 80 || hh.cx > cam.x + viewW + 80 || hh.cy < cam.y - 80 || hh.cy > cam.y + viewH + 80) continue;
    drawables.push([hh.cy, 1000 + hi2, 0]);
  }
  drawables.sort(function (a, b2) { return a[0] - b2[0]; });
  for (var d = 0; d < drawables.length; d++) {
    var oy = drawables[d][0];
    if (!drewPlayer && player.y < oy) { drawPlayer(px, py, t); drewPlayer = true; }
    var ox = drawables[d][1] * TILE + TILE / 2;
    var oyy = drawables[d][2] * TILE + TILE / 2;
    var btx = drawables[d][1], bty = drawables[d][2];
    var bti2 = idx(btx, bty);
    if (btx >= 1000) drawCrab(crabHoles[btx - 1000], t);
    else if (stumps[bti2]) drawStump(ox, oyy, btx, bty);
    else {
      var bsc = bushScale(btx, bty);
      var bdx = player.x - ox, bdy = player.y - oyy;
      var bUnder = (bdx * bdx + bdy * bdy) < (16 * bsc + 6) * (16 * bsc + 6);
      var bTarget = bUnder ? 0.5 : 1;
      bushA[bti2] += (bTarget - bushA[bti2]) * Math.min(1, rdt * 10);
      drawBush(ox, oyy, btx, bty, berryN[bti2], bushA[bti2]);
    }
  }
  if (!drewPlayer) drawPlayer(px, py, t);

  // Tree canopies seen straight from above, always drawn above the player.
  // They fade when you slip underneath so you can still see yourself.
  // Uses the widened range so canopies hanging in from off-screen tiles
  // are already drawn before their trunk tile scrolls into view.
  for (var ty2 = oy0; ty2 <= oy1; ty2++) {
    for (var tx2 = ox0; tx2 <= ox1; tx2++) {
      var k = idx(tx2, ty2);
      if (!trees[k]) continue;
      var tsc = treeScale(tx2, ty2);
      var ccx = tx2 * TILE + TILE / 2, ccy = ty2 * TILE + TILE / 2;
      var pdx = player.x - ccx, pdy = player.y - ccy;
      var under = (pdx * pdx + pdy * pdy) < (24 * tsc + 6) * (24 * tsc + 6);
      var target = under ? 0.45 : 1;
      treeA[k] += (target - treeA[k]) * Math.min(1, rdt * 10);
      var trunkTarget = under ? 1 : 0;
      trunkA[k] += (trunkTarget - trunkA[k]) * Math.min(1, rdt * 10);
      drawTree(ccx, ccy, tx2, ty2, treeA[k], trunkA[k]);
    }
  }

  // Pine canopies the same way: above the player, fading when underneath.
  for (var ny2 = oy0; ny2 <= oy1; ny2++) {
    for (var nx2 = ox0; nx2 <= ox1; nx2++) {
      var nk = idx(nx2, ny2);
      if (!pines[nk]) continue;
      var nsc = pineScale(nx2, ny2);
      var nccx = nx2 * TILE + TILE / 2, nccy = ny2 * TILE + TILE / 2;
      var npdx = player.x - nccx, npdy = player.y - nccy;
      var nunder = (npdx * npdx + npdy * npdy) < (24 * nsc + 6) * (24 * nsc + 6);
      var ntarget = nunder ? 0.45 : 1;
      pineA[nk] += (ntarget - pineA[nk]) * Math.min(1, rdt * 10);
      var pineTrunkTarget = nunder ? 1 : 0;
      pineTrunkA[nk] += (pineTrunkTarget - pineTrunkA[nk]) * Math.min(1, rdt * 10);
      drawPine(nccx, nccy, nx2, ny2, pineA[nk], pineTrunkA[nk]);
    }
  }

  // Palms above the player too; fronds fade and the trunk ring shows
  // when you slip underneath, just like regular trees.
  for (var py2 = oy0; py2 <= oy1; py2++) {
    for (var px2 = ox0; px2 <= ox1; px2++) {
      var pk = idx(px2, py2);
      if (!palms[pk]) continue;
      var psc = palmScale(px2, py2);
      var pccx = px2 * TILE + TILE / 2, pccy = py2 * TILE + TILE / 2;
      var ppdx = player.x - pccx, ppdy = player.y - pccy;
      var punder = (ppdx * ppdx + ppdy * ppdy) < (24 * psc + 6) * (24 * psc + 6);
      var ptarget = punder ? 0.45 : 1;
      palmA[pk] += (ptarget - palmA[pk]) * Math.min(1, rdt * 10);
      var ptrunkTarget = punder ? 1 : 0;
      palmTrunkA[pk] += (ptrunkTarget - palmTrunkA[pk]) * Math.min(1, rdt * 10);
      drawPalm(pccx, pccy, px2, py2, palmA[pk], palmTrunkA[pk]);
    }
  }

  // Screen-space UI (joystick, minimap)
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Touch joystick visual
  if (joy.active) {
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(joy.bx, joy.by, 55, 0, 7); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath(); ctx.arc(joy.bx + joy.dx * 55, joy.by + joy.dy * 55, 22, 0, 7); ctx.fill();
  }

  // Minimap
  var mm = 150, mx = vw - mm - 12, my = 12;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(mx - 5, my - 5, mm + 10, mm + 10);
  ctx.drawImage(mapCanvas, mx, my, mm, mm);
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 2;
  ctx.strokeRect(mx - 5, my - 5, mm + 10, mm + 10);
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(mx + (player.x / WORLD_PX) * mm, my + (player.y / WORLD_PY) * mm, 3.5, 0, 7);
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1;
  ctx.stroke();
}

// ---------- Main loop ----------
var last = performance.now();
function loop(now) {
  var dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render(now, dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
