<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232526"/>
      <stop offset="1" stop-color="#414345"/>
    </linearGradient>
    <linearGradient id="sq" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd700"/>
      <stop offset="1" stop-color="#4caf50"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="240" height="160" rx="16" fill="url(#bg)"/>
  <circle cx="205" cy="28" r="20" fill="#4caf50" opacity="0.25"/>
  <circle cx="28" cy="132" r="26" fill="#2196f3" opacity="0.25"/>
  <rect x="34" y="64" width="28" height="28" rx="6" fill="#ffd700" opacity="0.65" transform="rotate(-20 48 78)"/>
  <rect x="178" y="64" width="28" height="28" rx="6" fill="#4caf50" opacity="0.65" transform="rotate(15 192 78)"/>
  <g transform="rotate(-12 120 80)" filter="url(#glow)">
    <rect x="80" y="40" width="80" height="80" rx="14" fill="url(#sq)"/>
    <rect x="80" y="40" width="80" height="80" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3"/>
    <rect x="96" y="56" width="30" height="12" rx="6" fill="#ffffff" opacity="0.45"/>
  </g>
</svg>
