<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Play - Gamli</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Play free online browser games on Gamli.">
  <meta name="robots" content="index, follow">
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    body {
      background: url('back.png') center center/cover no-repeat fixed;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 22px;
      background: rgba(20, 28, 38, 0.92);
      box-shadow: 0 2px 12px #0008;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .topbar a.home {
      color: #fff;
      text-decoration: none;
      background: rgba(255,255,255,0.12);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      white-space: nowrap;
    }
    .topbar a.home:hover { background: rgba(255,255,255,0.22); }
    .topbar .brand {
      font-size: 1.4rem;
      font-weight: bold;
      letter-spacing: 2px;
      text-decoration: none;
      color: #ffd700;
    }
    .wrap {
      width: 94vw;
      max-width: 1100px;
      margin: 24px auto 60px auto;
    }
    .player-card {
      background: rgba(44, 62, 80, 0.94);
      border-radius: 18px;
      box-shadow: 0 4px 24px #0005;
      padding: 20px;
    }
    .player-head {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .player-icon { font-size: 2.2rem; }
    .player-title { font-size: 1.6rem; font-weight: bold; color: #ffd700; margin: 0; }
    .player-head .spacer { flex: 1; }
    .tool-btn {
      background: rgba(255,255,255,0.12);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .tool-btn:hover { background: rgba(255,255,255,0.25); }
    .tool-btn.primary {
      background: linear-gradient(90deg, #4caf50 0%, #2196f3 100%);
    }
    .tool-btn.primary:hover { filter: brightness(1.1); }
    #player-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      max-height: 74vh;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }
    #player-box iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000;
    }
    #exit-fs {
      display: none;
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    #exit-fs:hover { background: rgba(0, 0, 0, 0.85); }
    #player-box:fullscreen #exit-fs { display: inline-block; }
    #player-box:-webkit-full-screen #exit-fs { display: inline-block; }
    .info-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }
    @media (max-width: 800px) {
      .info-grid { grid-template-columns: 1fr; }
    }
    .info-card {
      background: rgba(44, 62, 80, 0.94);
      border-radius: 18px;
      box-shadow: 0 4px 24px #0005;
      padding: 20px 22px;
    }
    .info-card h2 {
      margin: 0 0 10px 0;
      font-size: 1.15rem;
      color: #ffd700;
      letter-spacing: 1px;
    }
    .info-card p { margin: 0; color: #e0e0e0; line-height: 1.55; }
    .related { margin-top: 28px; }
    .related h2 { text-shadow: 0 2px 8px #0008; letter-spacing: 1px; }
    .related-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
    }
    .rel-card {
      background: rgba(44, 62, 80, 0.92);
      border-radius: 14px;
      box-shadow: 0 4px 24px #0005;
      padding: 18px;
      width: 200px;
      text-align: center;
      text-decoration: none;
      color: #fff;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .rel-card:hover { transform: translateY(-4px) scale(1.03); box-shadow: 0 8px 32px #0007; }
    .rel-card .icon { font-size: 2rem; }
    .rel-card .name { font-weight: bold; color: #ffd700; margin: 8px 0 10px 0; }
    .rel-card .go {
      display: inline-block;
      background: linear-gradient(90deg, #4caf50 0%, #2196f3 100%);
      border-radius: 8px;
      padding: 7px 20px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    #not-found { text-align: center; padding: 60px 20px; }
    #not-found a { color: #ffd700; }
    footer {
      margin: 40px auto 30px auto;
      color: #fff;
      font-size: 0.95rem;
      text-align: center;
      background: rgba(0, 0, 0, 0.65);
      width: fit-content;
      max-width: 90vw;
      padding: 12px 20px;
      border-radius: 10px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="home" href="index.html">← All Games</a>
    <a class="brand" href="index.html">Gamli</a>
  </div>

  <div class="wrap" id="content" style="display:none;">
    <div class="player-card">
      <div class="player-head">
        <span class="player-icon" id="game-icon">🎮</span>
        <h1 class="player-title" id="game-title">Game</h1>
        <span class="spacer"></span>
        <button class="tool-btn" id="restart-btn" type="button">↻ Restart</button>
        <button class="tool-btn primary" id="fullscreen-btn" type="button">⛶ Fullscreen</button>
      </div>
      <div id="player-box">
        <iframe id="game-frame" title="Game" allowfullscreen allow="fullscreen; autoplay"></iframe>
        <button id="exit-fs" type="button">✕ Exit fullscreen</button>
      </div>
    </div>

    <div class="info-grid">
      <div class="info-card">
        <h2>About this game</h2>
        <p id="game-desc"></p>
      </div>
      <div class="info-card">
        <h2>How to play</h2>
        <p id="game-controls"></p>
      </div>
    </div>

    <div class="related">
      <h2>More games</h2>
      <div class="related-grid" id="related-grid"></div>
    </div>
  </div>

  <div class="wrap" id="not-found" style="display:none;">
    <h1>Game not found 😕</h1>
    <p><a href="index.html">← Back to all games</a></p>
  </div>

  <footer>
    &copy; <span id="year">2026</span> My Games. All rights reserved.<br>
    <span style="font-size:0.9em;">This site is indexed by Google. Share and play with friends!</span>
  </footer>

  <script>
    var GAMES = {
      "square": {
        title: "Square Clicker",
        icon: "🟨",
        src: "new-game/square.html",
        desc: "A fast-paced clicking game. Click the square to earn money, then spend it on upgrades that boost your earnings per click and per second.",
        controls: "Click the square to earn. Buy upgrades with your earnings. Progress saves automatically."
      },
      "platformer": {
        title: "Simple 3D Platformer",
        icon: "🏃",
        src: "platformer-game.html",
        desc: "Jump and move in a 3D world! Navigate platforms, avoid falling, and reach the goal in each level.",
        controls: "Move with Arrow keys, jump with Arrow Up. Reach the goal without falling."
      },
      "explore": {
        title: "Terrain Adventure",
        icon: "🗺️",
        src: "new-game/explore.html",
        desc: "Explore a procedurally generated infinite terrain. Walk across land, water, sand, and rocks — and watch out for enemies!",
        controls: "Move with Arrow keys. Press Space for a spin attack. Press R to restart after game over."
      },
      "tower": {
        title: "Wizard Tower",
        icon: "🧙",
        src: "tower.html",
        desc: "Defeat monsters, dodge traps, collect powerups, and climb the tower in this elemental action game!",
        controls: "Move with Arrow keys / WASD. Cast with J (fire), K (ice), L (lightning). Switch elements with 1 / 2 / 3."
      },
      "typing": {
        title: "Galactic Typing Defense",
        icon: "⌨️",
        src: "typing.html",
        desc: "Type words to shoot down the enemy words and defend your base! Survive waves and level up.",
        controls: "Type an enemy word and press Enter to shoot it. Move your ship with Left / Right arrows."
      },
      "color": {
        title: "Color Combo Memory Game",
        icon: "🎨",
        src: "color.html",
        desc: "Follow which colors light up, then copy the sequence to get a new high score!",
        controls: "Press Start, watch the sequence, then click the colors in the same order."
      },
      "merge": {
        title: "Merge Vehicles",
        icon: "🚗",
        src: "v.html",
        desc: "Merge to create new vehicles and put them on the road to earn more money!",
        controls: "Buy cars, drag two matching cars together to merge them. Drag cars onto the road to earn money over time."
      },
      "base": {
        title: "Base Defense",
        icon: "🛡️",
        src: "base.html",
        desc: "Buy and upgrade shooters to protect your base against waves of enemies!",
        controls: "Use the panel to buy and upgrade shooters. Survive as many waves as you can."
      },
      "bounce": {
        title: "Bounce Higher!",
        icon: "🏀",
        src: "comp/index.html",
        desc: "Bounce your way up through challenging platforms and reach new heights!",
        controls: "Move with Left / Right arrows (or A / D). Land on platforms to bounce higher. Don't fall!"
      },
      "circles": {
        title: "Circles on Ice",
        icon: "⭕",
        src: "shooter.html",
        desc: "Move circles on a slippery ice surface in this unique physics game! Play solo or with a friend, including tag mode.",
        controls: "Player 1: Arrow keys. Player 2: WASD. Press Space to start. Try Tag mode for a twist!"
      },
      "draw": {
        title: "Color Draw",
        icon: "✏️",
        src: "h.html",
        desc: "Express your creativity with this fun drawing and painting game!",
        controls: "Click and drag to draw. Pick colors and brush size from the palette at the bottom."
      }
    };

    document.getElementById('year').textContent = new Date().getFullYear();

    function getId() {
      try {
        return new URLSearchParams(window.location.search).get('game');
      } catch (e) {
        return null;
      }
    }

    var id = getId();
    var game = id && GAMES[id];

    if (!game) {
      document.getElementById('not-found').style.display = '';
      document.title = 'Game not found - Gamli';
    } else {
      document.getElementById('content').style.display = '';
      document.getElementById('game-icon').textContent = game.icon;
      document.getElementById('game-title').textContent = game.title;
      document.getElementById('game-desc').textContent = game.desc;
      document.getElementById('game-controls').textContent = game.controls;
      document.title = game.title + ' - Gamli';
      var frame = document.getElementById('game-frame');
      frame.title = game.title;
      frame.src = game.src;

      document.getElementById('restart-btn').addEventListener('click', function () {
        frame.contentWindow.location.reload();
      });

      document.getElementById('fullscreen-btn').addEventListener('click', function () {
        var box = document.getElementById('player-box');
        if (document.fullscreenElement) {
          document.exitFullscreen();
        } else if (box.requestFullscreen) {
          box.requestFullscreen();
        }
      });

      document.getElementById('exit-fs').addEventListener('click', function () {
        if (document.fullscreenElement) {
          document.exitFullscreen();
        }
      });

      function syncFsLabel() {
        document.getElementById('fullscreen-btn').textContent =
          document.fullscreenElement ? '✕ Exit fullscreen' : '⛶ Fullscreen';
      }
      document.addEventListener('fullscreenchange', syncFsLabel);

      // Stop arrow keys / space from scrolling this page.
      // Games run in their own frame and handle these keys themselves.
      document.addEventListener('keydown', function (e) {
        var tag = (e.target && e.target.tagName) || '';
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;
        if (e.key === 'ArrowUp' || e.key === 'ArrowDown' ||
            e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
          e.preventDefault();
        } else if ((e.key === ' ' || e.code === 'Space') && tag !== 'BUTTON' && tag !== 'A') {
          e.preventDefault();
        }
      });

      // Give the game keyboard focus on load so its controls work right away.
      frame.addEventListener('load', function () {
        try { frame.contentWindow.focus(); } catch (err) {}
      });

      // Lock page scrolling while the game is engaged (hovered or focused).
      // Arrow keys otherwise "chain" out of the game frame and scroll this page.
      var playerBox = document.getElementById('player-box');
      function lockPageScroll() {
        document.documentElement.style.overflow = 'hidden';
        document.body.style.overflow = 'hidden';
      }
      function unlockPageScroll() {
        document.documentElement.style.overflow = '';
        document.body.style.overflow = '';
      }
      playerBox.addEventListener('mouseenter', lockPageScroll);
      playerBox.addEventListener('mouseleave', function () {
        if (document.activeElement !== frame) unlockPageScroll();
      });
      window.addEventListener('blur', function () {
        setTimeout(function () {
          if (document.activeElement === frame) lockPageScroll();
        }, 0);
      });
      window.addEventListener('focus', unlockPageScroll);

      var grid = document.getElementById('related-grid');
      Object.keys(GAMES).forEach(function (key) {
        if (key === id) return;
        var g = GAMES[key];
        var a = document.createElement('a');
        a.className = 'rel-card';
        a.href = 'play.html?game=' + encodeURIComponent(key);
        var icon = document.createElement('div');
        icon.className = 'icon';
        icon.textContent = g.icon;
        var name = document.createElement('div');
        name.className = 'name';
        name.textContent = g.title;
        var go = document.createElement('span');
        go.className = 'go';
        go.textContent = 'Play';
        a.appendChild(icon);
        a.appendChild(name);
        a.appendChild(go);
        grid.appendChild(a);
      });
    }
  </script>
</body>
</html>
